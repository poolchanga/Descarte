<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    inicializarDashboard();
  });

  function inicializarDashboard() {
    var usuario = localStorage.getItem('sesion_usuario') || 'Usuario';
    var empresa = localStorage.getItem('sesion_empresa') || 'General';
    var tipoAcceso = localStorage.getItem('sesion_tipo') || 'INTERNO';
    var producto = (localStorage.getItem('sesion_producto') || 'ARANDANOS').toUpperCase();
    
    document.getElementById('lbl-nombre-usuario').innerText = usuario;
    document.getElementById('lbl-empresa-usuario').innerText = "Empresa: " + empresa;
    
    var opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('txt-fecha-actual').innerText = new Date().toLocaleDateString('es-ES', opciones);

    var menuDespachos = document.getElementById('menu-despachos');
    if (menuDespachos) {
      menuDespachos.style.display = (empresa.toUpperCase() === 'ADMIN' && tipoAcceso !== 'CLIENTE') ? '' : 'none';
    }
    var etiquetaPerfil = document.getElementById('lbl-perfil-producto');
    if (etiquetaPerfil) etiquetaPerfil.textContent = 'Perfil: ' + (producto === 'UVA' ? 'UVA' : 'ARÁNDANOS');
    var selectorAdmin = document.getElementById('selector-perfil-admin');
    if (selectorAdmin && empresa.toUpperCase() === 'ADMIN' && tipoAcceso !== 'CLIENTE') {
      selectorAdmin.style.display = ''; selectorAdmin.value = producto;
    }
    aplicarPerfilProducto(producto);
  }

  function aplicarPerfilProducto(producto) {
    producto = String(producto || 'ARANDANOS').toUpperCase();
    var esUva = producto === 'UVA';
    ['cruce-empresa','reg-empresa','dash-empresa'].forEach(function(id) {
      var select = document.getElementById(id);
      if (!select) return;
      Array.prototype.slice.call(select.options).forEach(function(op) {
        if (op.value.toUpperCase() === 'LARAMA') op.hidden = esUva;
      });
      if (esUva && select.value.toUpperCase() === 'LARAMA') select.value = 'AGA';
    });
    var titulo = document.querySelector('.dash-kicker');
    if (titulo) titulo.textContent = esUva ? 'CONTROL GENERAL DE OPERACIONES · UVA' : 'CONTROL GENERAL DE OPERACIONES · ARÁNDANOS';
  }

  function cambiarPerfilProductoAdmin(producto) {
    if (String(localStorage.getItem('sesion_empresa') || '').toUpperCase() !== 'ADMIN') return;
    producto = String(producto || 'ARANDANOS').toUpperCase() === 'UVA' ? 'UVA' : 'ARANDANOS';
    localStorage.setItem('sesion_producto', producto);
    var etiqueta = document.getElementById('lbl-perfil-producto');
    if (etiqueta) etiqueta.textContent = 'Perfil: ' + (producto === 'UVA' ? 'UVA' : 'ARÁNDANOS');
    aplicarPerfilProducto(producto);
    // Recargar el dashboard para que vuelva a consultar bajo el perfil seleccionado.
    if (typeof cargarDashboardDatos === 'function') cargarDashboardDatos(true);
    borrarReportes();
    borrarCruce();
  }

  function cambiarPestana(evento, idTab) {
    var contenidos = document.getElementsByClassName("tab-content");
    for (var i = 0; i < contenidos.length; i++) {
      contenidos[i].classList.remove("active");
    }

    var botones = document.getElementsByClassName("menu-item");
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove("active");
    }

    document.getElementById(idTab).classList.add("active");
    evento.currentTarget.classList.add("active");

    var titulos = {
      'tab-dashboard': 'Dashboard General',
      'tab-reporte': 'Módulo de Reportes',
      'tab-cruce': 'Cruce de Stocks',
      'tab-guias': 'Despachos · Guía Provisional',
      'tab-ventas': 'Módulo de Ventas',
      'tab-despachos': 'Módulo de Despachos'
    };
    document.getElementById('txt-titulo-pestana').innerText = titulos[idTab];

    if (idTab === 'tab-guias') {
      inicializarModuloGuias();
    }

    if (idTab === 'tab-ventas') {
      inicializarModuloVentas();
    }

    if (idTab === 'tab-despachos') {
      var contenedorPrincipal = document.querySelector('.main-content');
      if (contenedorPrincipal) contenedorPrincipal.scrollTop = 0;
      inicializarModuloDespachos();
      requestAnimationFrame(function(){
        var tabDespachos = document.getElementById('tab-despachos');
        if (tabDespachos && contenedorPrincipal) contenedorPrincipal.scrollTop = Math.max(0, tabDespachos.offsetTop - 4);
      });
    }
  }

  var datosReporteActual = [];

  function buscarReportes() {
    var estadoInicial = document.getElementById('reporte-estado-inicial');
    var contenedorReporte = document.getElementById('div-resultado-reporte');
    if (estadoInicial) estadoInicial.style.display = 'none';
    if (contenedorReporte) contenedorReporte.style.display = 'none';

    var fInicio = document.getElementById('fecha-inicio').value;
    var fFin = document.getElementById('fecha-fin').value;
    
    if (!fInicio || !fFin) {
      alert("Por favor, seleccione ambas fechas para realizar la búsqueda.");
      return;
    }
    
    // Cambiamos el texto de la fecha de reporte mientras carga, sin borrar el HTML
    document.getElementById('lbl-fecha-reporte').innerText = "🔍 Cargando...";
    
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta.exito) {
          alert("❌ " + respuesta.mensaje);
          document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";
          return;
        }
        
        if (!respuesta.datos || respuesta.datos.length === 0) {
          alert("⚠️ " + (respuesta.mensaje || "No hay datos para este rango."));
          borrarReportes();
          return;
        }
        
        datosReporteActual = respuesta.datos;
        if (contenedorReporte) contenedorReporte.style.display = '';
        renderizarReporteVisual(respuesta.datos);
      })
      .withFailureHandler(function(err) {
        alert("Error en el servidor: " + err.message);
        document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";
        if (contenedorReporte) contenedorReporte.style.display = 'none';
        if (estadoInicial) estadoInicial.style.display = '';
      })
      .obtenerDatosReportePorFechas(fInicio, fFin, localStorage.getItem('sesion_producto') || 'ARANDANOS');
  }

  function renderizarReporteVisual(datos) {
    // 1. Actualizar fecha de reporte en el badge
    var fInicio = document.getElementById('fecha-inicio').value;
    var fFin = document.getElementById('fecha-fin').value;
    if (fFin) {
      var partesF = fFin.split("-");
      if (partesF.length === 3) {
        document.getElementById('lbl-fecha-reporte').innerText = partesF[2] + '/' + partesF[1] + '/' + partesF[0];
      }
    }

    var empresas = ["LARAMA", "AGA", "ARENUVA"];
    var totalGeneralKilos = 0;

    empresas.forEach(function(emp) {
      var empLower = emp.toLowerCase();
      var filasEmpresa = datos.filter(d => (d.empresa || '').toUpperCase() === emp);

      // Filtrar filas por tipo de descarte
      var campoRows = filasEmpresa.filter(r => (r.presentacion || '').toUpperCase().includes("CAMPO"));
      var packingRows = filasEmpresa.filter(r => (r.presentacion || '').toUpperCase().includes("PACKING"));

      var tbodyCampo = document.querySelector('#tabla-' + empLower + '-campo tbody');
      var tbodyPacking = document.querySelector('#tabla-' + empLower + '-packing tbody');
      var empresaCard = document.querySelector('#tabla-' + empLower + '-campo')?.closest('.empresa-card');
      var tablaBoxCampo = tbodyCampo ? tbodyCampo.closest('.tabla-box') : null;
      var tablaBoxPacking = tbodyPacking ? tbodyPacking.closest('.tabla-box') : null;
      var empresaGrid = empresaCard ? empresaCard.querySelector('.empresa-grid') : null;

      var subtotalCampo = 0;
      var subtotalPacking = 0;

      // --- 1. PROCESAR TABLA CAMPO ---
      if (tbodyCampo) {
        tbodyCampo.innerHTML = "";
        if (campoRows.length === 0) {
          if (tablaBoxCampo) tablaBoxCampo.style.display = 'none';
        } else {
          if (tablaBoxCampo) tablaBoxCampo.style.display = '';
          var htmlCampo = "";
          campoRows.forEach(function(r) {
            var peso = parseFloat(r.peso || 0);
            subtotalCampo += peso;
            var tipoCampo = 'DESCARTE CAMPO';
            htmlCampo += '<tr>' +
              '<td>' + (r.fecha || '') + '</td>' +
              '<td>' + (r.planta || '') + '</td>' +
              '<td style="font-weight:bold; white-space:nowrap;">' + (r.codigo || '-') + '</td>' +
              '<td>' + (r.variedad || '') + '</td>' +
              '<td><span class="reporte-tipo-chip reporte-tipo-campo">' + tipoCampo + '</span></td>' +
              '<td style="text-align:right; font-weight:bold;">' + peso.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
            '</tr>';
          });

          // Fila Subtotal Campo
          htmlCampo += '<tr style="border-top: 2px solid #cbd5e1; font-weight: bold; background-color: #f8fafc;">' +
            '<td colspan="5" style="color: #475569; text-transform: uppercase;">TOTAL DESCARTE CAMPO</td>' +
            '<td style="text-align:right; font-weight:900;">' + subtotalCampo.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
          '</tr>';

          tbodyCampo.innerHTML = htmlCampo;
        }
      }

      // --- 2. PROCESAR TABLA PACKING ---
      if (tbodyPacking) {
        tbodyPacking.innerHTML = "";
        if (packingRows.length === 0) {
          if (tablaBoxPacking) tablaBoxPacking.style.display = 'none';
        } else {
          if (tablaBoxPacking) tablaBoxPacking.style.display = '';
          var htmlPacking = "";
          packingRows.forEach(function(r) {
            var peso = parseFloat(r.peso || 0);
            subtotalPacking += peso;
            var tipoPacking = 'DESCARTE PACKING';
            htmlPacking += '<tr>' +
              '<td>' + (r.fecha || '') + '</td>' +
              '<td>' + (r.planta || '') + '</td>' +
              '<td style="font-weight:bold; white-space:nowrap;">' + (r.codigo || '-') + '</td>' +
              '<td>' + (r.variedad || '') + '</td>' +
              '<td><span class="reporte-tipo-chip reporte-tipo-packing">' + tipoPacking + '</span></td>' +
              '<td style="text-align:right; font-weight:bold;">' + peso.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
            '</tr>';
          });

          // Fila Subtotal Packing
          htmlPacking += '<tr style="border-top: 2px solid #cbd5e1; font-weight: bold; background-color: #f8fafc;">' +
            '<td colspan="5" style="color: #475569; text-transform: uppercase;">TOTAL DESCARTE PACKING</td>' +
            '<td style="text-align:right; font-weight:900;">' + subtotalPacking.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
          '</tr>';

          tbodyPacking.innerHTML = htmlPacking;
        }
      }

      // --- 3. AJUSTAR DISTRIBUCIÓN VISUAL DE LA EMPRESA ---
      if (empresaCard && empresaGrid) {
        var hayCampo = campoRows.length > 0;
        var hayPacking = packingRows.length > 0;
        empresaCard.style.display = (hayCampo || hayPacking) ? '' : 'none';

        // Ajustar la cuadrícula al contenido real para evitar espacios vacíos.
        if (hayCampo && hayPacking) {
          empresaGrid.style.setProperty('grid-template-columns', 'minmax(0, 1fr) minmax(0, 1fr) 145px', 'important');
          empresaGrid.style.maxWidth = '';
          empresaGrid.style.marginLeft = '';
          empresaGrid.style.marginRight = '';
        } else if (hayCampo || hayPacking) {
          empresaGrid.style.setProperty('grid-template-columns', 'minmax(0, 1fr) 145px', 'important');
          empresaGrid.style.maxWidth = '1100px';
          empresaGrid.style.marginLeft = 'auto';
          empresaGrid.style.marginRight = 'auto';
          var tablaVisible = hayPacking ? tablaBoxPacking : tablaBoxCampo;
          if (tablaVisible) {
            tablaVisible.style.width = '100%';
            tablaVisible.style.minWidth = '0';
          }
        }
      }

      // --- 4. ACTUALIZAR TOTAL EMPRESA ---
      var totalEmpresa = subtotalCampo + subtotalPacking;
      totalGeneralKilos += totalEmpresa;

      var elemTotalEmpresa = document.getElementById('total-' + empLower);
      if (elemTotalEmpresa) {
        elemTotalEmpresa.innerText = totalEmpresa.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3});
      }
    });

    // --- 5. ACTUALIZAR BANNER TOTAL GENERAL ---
    var elemTotalGeneral = document.getElementById('total-general-kilos');
    if (elemTotalGeneral) {
      elemTotalGeneral.innerText = totalGeneralKilos.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3});
    }
  }


  function renderizarTablasCruce(datos, stockTotal) {
    var tbodyCampo = document.querySelector('#tabla-cruce-campo tbody');
    var tbodyPacking = document.querySelector('#tabla-cruce-packing tbody');

    tbodyCampo.innerHTML = "";
    tbodyPacking.innerHTML = "";

    var campoFilas = datos.filter(d => d.grupo === "CAMPO");
    var packingFilas = datos.filter(d => d.grupo === "PACKING");

    var armarFilasHtml = function(lista) {
      var html = "";
      var sumaSispacking = 0;
      var sumaSap = 0;
      var sumaDiferencia = 0;

      lista.forEach(function(r) {
        var estiloCeldaDif = "font-weight:bold;";
        var valorSispacking = parseFloat(r.sispacking || 0);
        var valorSap = parseFloat(r.sap || 0);
        
        var difReal = valorSap - valorSispacking;
        sumaSispacking += valorSispacking;
        sumaSap += valorSap;
        sumaDiferencia += difReal;

        /*
         * DIFERENCIA:
         * Positiva  = sobra       -> verde
         * Negativa  = diferencia  -> rojo
         * Cero      = neutro
         *
         * Se utiliza !important porque el CSS de Interfaz.html
         * establece background:#ffffff !important para las celdas.
         */
        if (difReal > 0) {
          estiloCeldaDif += " background-color: #d4edda !important; color: #155724 !important;";
        } else if (difReal < 0) {
          estiloCeldaDif += " background-color: #f8d7da !important; color: #721c24 !important;";
        } else {
          estiloCeldaDif += " background-color: #ffffff !important; color: #334155 !important;";
        }

        html += '<tr>' +
          '<td>' + (r.empresa || '') + '</td>' +
          '<td style="font-weight: bold; color: #475569;">' + (r.codigo || '-') + '</td>' +
          '<td>' + (r.fecha || '') + '</td>' +
          '<td style="white-space:nowrap;">' + (r.variedad || '') + '</td>' +
          '<td>' + (r.tipoDescarte || '') + '</td>' +
          '<td style="text-align:right;">' + valorSispacking.toFixed(3) + '</td>' +
          '<td style="text-align:right;">' + valorSap.toFixed(3) + '</td>' +
          '<td style="' + estiloCeldaDif + ' text-align:right;">' + difReal.toFixed(3) + '</td>' +
        '</tr>';
      });

      /*
       * TOTAL DIFERENCIA:
       * Positiva  = verde
       * Negativa  = rojo
       * Cero      = neutro
       */
      var estiloTotalDif = "font-weight:bold; text-align:right;";

      if (sumaDiferencia > 0) {
        estiloTotalDif += " background-color: #d4edda !important; color: #155724 !important;";
      } else if (sumaDiferencia < 0) {
        estiloTotalDif += " background-color: #f8d7da !important; color: #721c24 !important;";
      } else {
        estiloTotalDif += " background-color: #ffffff !important; color: #334155 !important;";
      }

      html += '<tr style="background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #cbd5e1;">' +
        '<td colspan="5" style="text-align: center;">TOTALES</td>' +
        '<td style="text-align:right;">' + sumaSispacking.toFixed(3) + '</td>' +
        '<td style="text-align:right;">' + sumaSap.toFixed(3) + '</td>' +
        '<td style="' + estiloTotalDif + '">' + sumaDiferencia.toFixed(3) + '</td>' +
      '</tr>';

      return html;
    };

    tbodyCampo.innerHTML = armarFilasHtml(campoFilas);
    tbodyPacking.innerHTML = armarFilasHtml(packingFilas);

    // RENDERIZAR TABLA DE STOCK TOTAL (COLUMNA J)
    var tbodyStock = document.getElementById('tbodyStockTotal');
    if (tbodyStock) {
      tbodyStock.innerHTML = "";
      if (!stockTotal || stockTotal.length === 0) {
        tbodyStock.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#64748b;">No hay registros de Stock Total para el período.</td></tr>';
      } else {
        stockTotal.forEach(function(st) {
          var tr = document.createElement("tr");
          tr.innerHTML = 
            "<td>" + st.empresa + "</td>" +
            "<td>" + st.codigo + "</td>" +
            "<td>" + st.variedad + "</td>" +
            "<td>" + st.tipoDescarte + "</td>" +
            "<td style='font-weight:bold; color:#0d6efd; text-align:right;'>" + Number(st.stockTotal).toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + "</td>";
          tbodyStock.appendChild(tr);
        });
      }
    }
  }


  function borrarReportes() {
    document.getElementById('fecha-inicio').value = "";
    document.getElementById('fecha-fin').value = "";
    document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";

    var empresas = ["larama", "aga", "arenuva"];
    empresas.forEach(function(emp) {
      var tbCampo = document.querySelector('#tabla-' + emp + '-campo tbody');
      var tbPacking = document.querySelector('#tabla-' + emp + '-packing tbody');

      if (tbCampo) tbCampo.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:10px;">Sin datos</td></tr>';
      if (tbPacking) tbPacking.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:10px;">Sin datos</td></tr>';

      var lblTot = document.getElementById('total-' + emp);
      if (lblTot) lblTot.innerText = "0.000";
    });

    document.getElementById('total-general-kilos').innerText = "0.000";
    datosReporteActual = [];

    var estadoInicial = document.getElementById('reporte-estado-inicial');
    var contenedorReporte = document.getElementById('div-resultado-reporte');
    if (contenedorReporte) contenedorReporte.style.display = 'none';
    if (estadoInicial) estadoInicial.style.display = '';
  }



function copiarDatosReporte() {
    if (!datosReporteActual || datosReporteActual.length === 0) {
      alert("No hay datos cargados en el reporte para copiar.");
      return;
    }

    var txt = "EMPRESA\tFECHA\tPLANTA/FUNDO ORIGEN\tCÓDIGO\tVARIEDAD\tTIPO DESCARTE\tPESO NETO (KG)\n";

    datosReporteActual.forEach(function(r) {
      var tipo = (r.presentacion || '').toUpperCase().includes('PACKING')
        ? 'DESCARTE PACKING'
        : 'DESCARTE CAMPO';

      txt += (r.empresa || '') + "\t" +
             (r.fecha || '') + "\t" +
             (r.planta || '') + "\t" +
             (r.codigo || '-') + "\t" +
             (r.variedad || '') + "\t" +
             tipo + "\t" +
             (r.peso || 0) + "\n";
    });

    var copiarFallback = function() {
      var temp = document.createElement("textarea");
      temp.value = txt;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.select();
      var exito = false;
      try {
        exito = document.execCommand("copy");
      } catch (e) {
        exito = false;
      }
      document.body.removeChild(temp);
      return exito;
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt)
        .then(function() {
          alert("¡Datos del reporte copiados con éxito para Excel!");
        })
        .catch(function() {
          if (copiarFallback()) {
            alert("¡Datos del reporte copiados con éxito para Excel!");
          } else {
            alert("No se pudo copiar automáticamente. Intente nuevamente.");
          }
        });
    } else if (copiarFallback()) {
      alert("¡Datos del reporte copiados con éxito para Excel!");
    } else {
      alert("No se pudo copiar automáticamente. Intente nuevamente.");
    }
  }

function cerrarSesion() {
    localStorage.removeItem('sesion_usuario');
    localStorage.removeItem('sesion_empresa');
    localStorage.removeItem('sesion_tipo');
    localStorage.removeItem('sesion_token');
    localStorage.removeItem('sesion_producto');
    window.location.reload();
  }
  function copiarCruce() {
    if (datosCruceGlobal.length === 0) {
      alert("No hay datos cargados en el cruce para copiar.");
      return;
    }

    var txt = "EMPRESA\tCÓDIGO\tFECHA\tVARIEDAD\tTIPO DESCARTE\tSISPACKING (KG)\tSAP (KG)\tDIFERENCIA\n";

    datosCruceGlobal.forEach(function(r) {
      var codigoProducto = r.codigo || '-';

      txt += (r.empresa || '') + "\t" + 
             codigoProducto + "\t" + 
             (r.fecha || '') + "\t" + 
             (r.variedad || '') + "\t" + 
             (r.tipoDescarte || '') + "\t" + 
             (r.sispacking || 0) + "\t" + 
             (r.sap || 0) + "\t" + 
             (r.diferencia || 0) + "\n";
    });

    var temp = document.createElement("textarea");
    temp.value = txt;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    document.body.removeChild(temp);

    alert("¡Cruce de stocks copiado con éxito para Excel!");
  }


  // MÓDULO GUÍAS PROVISIONALES
  var productosGuiasDisponibles = [];

  function inicializarModuloGuias() {
    var empresa = document.getElementById('reg-empresa');
    var cliente = document.getElementById('reg-cliente');
    var documento = document.getElementById('reg-documento');
    var condicion = document.getElementById('reg-condicion');
    var autorizado = document.getElementById('reg-autorizado');
    var fechaEmision = document.getElementById('reg-fecha-emision');
    var fechaVencimiento = document.getElementById('reg-fecha-vencimiento');
    var direccion = document.getElementById('reg-direccion');
    var observaciones = document.getElementById('reg-observaciones');
    var link = document.getElementById('reg-link-origen');
    var mensajeLink = document.getElementById('reg-link-mensaje');
    var banner = document.getElementById('banner-emisor-fiscal');
    var tbody = document.getElementById('tbody-detalle-guias');

    if (cliente && !cliente.dataset.autollenadoClienteConfigurado) {
      cliente.addEventListener('change', function() {
        cargarDatosClienteGuia(cliente.value);
      });
      cliente.addEventListener('blur', function() {
        cargarDatosClienteGuia(cliente.value);
      });
      cliente.dataset.autollenadoClienteConfigurado = '1';
    }

    if (cliente) cliente.value = '';
    if (documento) documento.value = '';
    if (condicion) condicion.value = 'CONTADO';
    if (autorizado) autorizado.value = '';
    if (direccion) direccion.value = '';
    if (observaciones) observaciones.value = '';
    if (link) link.value = '';
    if (mensajeLink) {
      mensajeLink.innerText = '';
      mensajeLink.style.color = '#64748b';
    }
    if (banner) banner.style.display = 'none';

    var hoy = obtenerFechaInputHoy();
    if (fechaEmision) fechaEmision.value = hoy;
    if (fechaVencimiento) fechaVencimiento.value = hoy;

    productosGuiasDisponibles = [];

    if (tbody) {
      tbody.innerHTML = '';
      agregarFilaProducto();
    }

    calcularTotalKilosEnVivo();

    if (empresa && empresa.value) {
      actualizarEmpresaEmisora();
    } else {
      var lblCorr = document.getElementById('txt-correlativo');
      if (lblCorr) lblCorr.innerText = 'Seleccione empresa';
    }
  }

  function cargarDatosClienteGuia(clienteNombre) {
    var nombre = String(clienteNombre || '').trim();
    var documento = document.getElementById('reg-documento');
    var direccion = document.getElementById('reg-direccion');
    var condicion = document.getElementById('reg-condicion');

    if (!nombre) {
      if (documento) documento.value = '';
      if (direccion) direccion.value = '';
      if (condicion) condicion.value = 'CONTADO';
      return;
    }

    if (documento) documento.value = 'Cargando...';
    if (direccion) direccion.value = 'Cargando...';

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (!resultado || !resultado.exito) {
          if (documento) documento.value = '';
          if (direccion) direccion.value = '';
          if (condicion) condicion.value = 'CONTADO';
          return;
        }

        if (documento) documento.value = resultado.documento || '';
        if (direccion) direccion.value = resultado.direccion || '';
        if (condicion) condicion.value = resultado.condicionPago || 'CONTADO';
      })
      .withFailureHandler(function(error) {
        if (documento) documento.value = '';
        if (direccion) direccion.value = '';
        if (condicion) condicion.value = 'CONTADO';
        console.error('Error buscando datos del cliente en CLIENTES:', error);

      .obtenerDatosClienteDespacho(nombre);

  function obtenerFechaInputHoy() {
    var hoy = new Date();
    var anio = hoy.getFullYear();
    var mes = String(hoy.getMonth() + 1).padStart(2, '0');
    var dia = String(hoy.getDate()).padStart(2, '0');
    return anio + '-' + mes + '-' + dia;
  }

  function formatearFechaGuia(fecha) {
    if (!fecha) return '-';
    var partes = fecha.split('-');
    if (partes.length === 3) return partes[2] + '/' + partes[1] + '/' + partes[0];
    return fecha;
  }

    var tbody = document.getElementById('tbody-detalle-guias');
    if (!tbody) return;

    var tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #f1f5f9';

    tr.innerHTML = `
      <td style="padding: 8px 10px;">
        <input type="text" class="input-codigo-prod" list="lista-codigos-guia" oninput="escucharCambioCodigo(this)" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-size:12px;" placeholder="Escriba código...">
      </td>
      <td style="padding: 8px 10px;">
        <input type="text" class="input-desc-prod" style="width:100%; padding:8px; border:none; background:transparent; font-weight:bold; color:#334155; font-size:12px;" readonly value="Proceda a buscar...">
      </td>
      <td style="padding: 8px 10px;">
        <input type="number" class="input-cant-prod" oninput="calcularTotalKilosEnVivo()" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; text-align:right; font-size:12px; font-weight:bold;" value="0.000" min="0" step="0.001">
      </td>
      <td style="padding: 8px 10px;">

  function actualizarListaCodigosGuia() {
    var datalist = document.getElementById('lista-codigos-guia');
    if (!datalist) return;

    datalist.innerHTML = '';
    productosGuiasDisponibles.forEach(function(producto) {
      var option = document.createElement('option');
      option.value = producto.codigo || '';
      option.label = producto.descripcion || '';
      datalist.appendChild(option);
    });
  }

  function escucharCambioCodigo(inputElement) {
    var codigoInput = inputElement.value.trim();
    var fila = inputElement.closest('tr');
    var descInput = fila ? fila.querySelector('.input-desc-prod') : null;

    if (!descInput) return;

    if (codigoInput.length === 0) {
      descInput.value = 'Proceda a buscar...';
      descInput.style.color = '#334155';
      return;
    }

    var productoCargado = productosGuiasDisponibles.find(function(producto) {
      return String(producto.codigo || '').trim().toUpperCase() === codigoInput.toUpperCase();
    });

    if (productoCargado) {
      descInput.value = productoCargado.descripcion || '';
      descInput.style.color = '#16a34a';
      return;
    }

    descInput.value = '🔍 Buscando...';
    descInput.style.color = '#2563eb';

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado && resultado.exito) {
          descInput.value = resultado.descripcion || '';
          descInput.style.color = '#16a34a';
        } else {
          descInput.value = 'PRODUCTO NO ENCONTRADO';
          descInput.style.color = '#dc2626';
        }
      })
      .withFailureHandler(function(error) {
        descInput.value = 'Error de búsqueda';
        descInput.style.color = '#dc2626';
        console.error('Error buscando producto:', error);
      })
      .buscarProductoPorCodigo(codigoInput);
  }

  function calcularTotalKilosEnVivo() {
    var total = 0;
    document.querySelectorAll('#tbody-detalle-guias .input-cant-prod').forEach(function(input) {
      total += parseFloat(input.value) || 0;
    });

    var totalElemento = document.getElementById('txt-total-kilos');
    if (totalElemento) totalElemento.innerText = total.toFixed(3);
  }

  function removerFilaYRecalcular(boton) {
    var tbody = document.getElementById('tbody-detalle-guias');
    if (!tbody) return;

    var filas = tbody.querySelectorAll('tr');
    if (filas.length <= 1) {
      filas[0].querySelectorAll('input').forEach(function(input) {
        input.value = input.classList.contains('input-cant-prod') ? '0.000' : '';
      });
      var desc = filas[0].querySelector('.input-desc-prod');
      if (desc) desc.value = 'Proceda a buscar...';
    } else {
      boton.closest('tr').remove();
    }

    calcularTotalKilosEnVivo();
  }

  function cargarProductosDesdeLinkGuia() {
    var empresa = document.getElementById('reg-empresa').value.trim().toUpperCase();
    var link = document.getElementById('reg-link-origen').value.trim();
    var mensaje = document.getElementById('reg-link-mensaje');
    var boton = document.getElementById('btn-cargar-link-guia');

    if (!empresa) {
      alert('Seleccione una empresa antes de cargar el link.');
      return;
    }

    if (!link) {
      alert('Pegue el link de origen antes de cargar los productos.');
      return;
    }

    if (mensaje) {
      mensaje.innerText = '🔍 Leyendo información del archivo...';
      mensaje.style.color = '#2563eb';
    }
    if (boton) {
      boton.disabled = true;
      boton.innerText = 'CARGANDO...';
    }

    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (boton) {
          boton.disabled = false;
          boton.innerText = '🔄 CARGAR';
        }

        if (!respuesta || !respuesta.exito) {
          productosGuiasDisponibles = [];
          actualizarListaCodigosGuia();
          if (mensaje) {
            mensaje.innerText = '❌ ' + (respuesta && respuesta.mensaje ? respuesta.mensaje : 'No se pudieron cargar los productos.');
            mensaje.style.color = '#dc2626';
          }
          return;
        }

        productosGuiasDisponibles = respuesta.productos || [];
        actualizarListaCodigosGuia();

        var tbody = document.getElementById('tbody-detalle-guias');
        if (tbody) {
          tbody.innerHTML = '';
          productosGuiasDisponibles.forEach(function(producto) {
            agregarFilaProducto();
            var fila = tbody.lastElementChild;
            if (!fila) return;

            var codigo = fila.querySelector('.input-codigo-prod');
            var descripcion = fila.querySelector('.input-desc-prod');
            var cantidad = fila.querySelector('.input-cant-prod');
            var um = fila.querySelector('.input-um-prod');

            if (codigo) codigo.value = producto.codigo || '';
            if (descripcion) {
              descripcion.value = producto.descripcion || '';
              descripcion.style.color = '#16a34a';
            }
            if (cantidad) cantidad.value = Number(producto.cantidad || 0).toFixed(3);
            if (um) um.value = producto.um || 'KG';
          });
        }

        calcularTotalKilosEnVivo();

        if (mensaje) {
          mensaje.innerText = '✓ ' + productosGuiasDisponibles.length + ' productos cargados desde ' + (respuesta.pestaña || 'el archivo') + '.';
          mensaje.style.color = '#16a34a';
        }
      })
      .withFailureHandler(function(error) {
        if (boton) {
          boton.disabled = false;
          boton.innerText = '🔄 CARGAR';
        }
        if (mensaje) {
          mensaje.innerText = '❌ Error en el servidor: ' + error.message;
          mensaje.style.color = '#dc2626';
        }
      })
      .obtenerProductosDesdeLinkGuia(empresa, link);

        } else {

  function procesarGuardadoGuia() {
    var empresa = document.getElementById('reg-empresa').value.trim().toUpperCase();
    var cliente = document.getElementById('reg-cliente').value.trim();
    var documento = document.getElementById('reg-documento').value.trim();
    var condicion = document.getElementById('reg-condicion').value.trim();
    var autorizado = document.getElementById('reg-autorizado').value.trim();
    var fechaEmision = document.getElementById('reg-fecha-emision').value;
    var fechaVencimiento = document.getElementById('reg-fecha-vencimiento').value;
    var direccion = document.getElementById('reg-direccion').value.trim();
    var observaciones = document.getElementById('reg-observaciones').value.trim();
    var linkOrigen = document.getElementById('reg-link-origen').value.trim();
    var usuario = localStorage.getItem('sesion_usuario') || 'SISTEMA';

    if (!empresa) {
      alert('Seleccione la empresa emisora.');
      return;
    }
    if (!cliente) {
      alert('Ingrese el cliente / destinatario.');
      return;
    }
    if (!documento) {
      alert('Ingrese el RUC/DNI del cliente.');
      return;
    }
    if (!fechaEmision) {
      alert('Seleccione la fecha de emisión.');
      return;
    }
    if (!fechaVencimiento) {
      alert('Seleccione la fecha de vencimiento.');
      return;
    }

    var productos = [];
    var filas = document.querySelectorAll('#tbody-detalle-guias tr');

    for (var i = 0; i < filas.length; i++) {
      var fila = filas[i];
      var codigoInput = fila.querySelector('.input-codigo-prod');
      var descripcionInput = fila.querySelector('.input-desc-prod');
      var cantidadInput = fila.querySelector('.input-cant-prod');
      var umInput = fila.querySelector('.input-um-prod');

      var codigo = codigoInput ? codigoInput.value.trim() : '';
      var descripcion = descripcionInput ? descripcionInput.value.trim() : '';
      var cantidad = cantidadInput ? parseFloat(cantidadInput.value) || 0 : 0;
      var um = umInput ? umInput.value.trim() || 'KG' : 'KG';

      if (!codigo && cantidad === 0) continue;

      if (!codigo) {
        alert('Hay una línea de producto sin código.');
        return;
      }
      if (!descripcion || descripcion === 'Proceda a buscar...' || descripcion === 'PRODUCTO NO ENCONTRADO' || descripcion === 'Error de búsqueda') {
        alert('Verifique que todos los códigos tengan una descripción válida.');
        return;
      }
      if (cantidad <= 0) {
        alert('Todos los productos deben tener una cantidad mayor a cero.');
        return;
      }

      productos.push({
        codigo: codigo,
        descripcion: descripcion,
        cantidad: cantidad,
        um: um
      });
    }

    if (productos.length === 0) {
      alert('Debe agregar al menos un producto.');
      return;
    }

    var cabecera = {
      empresa: empresa,
      cliente: cliente,
      documento: documento,
      condicion: condicion || 'CONTADO',
      autorizado: autorizado,
      fechaEmision: fechaEmision,
      fechaVencimiento: fechaVencimiento,
      direccion: direccion,
      observaciones: observaciones,
      linkOrigen: linkOrigen,
      creador: usuario
    };

    var boton = document.querySelector('#tab-guias button[onclick="procesarGuardadoGuia();"]');
    if (boton) {
      boton.disabled = true;
      boton.innerText = 'GUARDANDO...';
    }

    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (boton) {
          boton.disabled = false;
          boton.innerText = 'Guardar e Imprimir Nota';
        }

        if (!respuesta || !respuesta.exito) {
          alert('Error al guardar la guía: ' + (respuesta && respuesta.mensaje ? respuesta.mensaje : 'Error desconocido.'));
          return;
        }

        var datosImpresion = {
          correlativo: respuesta.correlativo,
          cabecera: {
            empresa: respuesta.razonSocial || cabecera.empresa,
            rucEmisor: respuesta.rucEmisor || '',
            cliente: cabecera.cliente,
            documento: cabecera.documento,
            direccion: cabecera.direccion,
            fechaEmision: formatearFechaGuia(cabecera.fechaEmision),
            fechaVencimiento: formatearFechaGuia(cabecera.fechaVencimiento),
            condicion: cabecera.condicion,
            autorizado: cabecera.autorizado,
            observaciones: cabecera.observaciones,
            urlLogo: respuesta.urlLogo || ''
          },
          creador: cabecera.creador,
          productos: productos
        };

        imprimirGuia(datosImpresion);
        alert('¡Guía guardada exitosamente con el correlativo: ' + respuesta.correlativo + '!');
        inicializarModuloGuias();
      })
      .withFailureHandler(function(error) {
        if (boton) {
          boton.disabled = false;
          boton.innerText = 'Guardar e Imprimir Nota';
        }
        alert('Error en el servidor: ' + error.message);
      })
      .guardarGuiaProvisional(cabecera, productos);
  }

  function imprimirGuia(datos) {
    window.datosImpresionActual = datos;

    google.script.run
      .withSuccessHandler(function(htmlContent) {
        var ventana = window.open('', '_blank', 'width=900,height=700');
        if (!ventana) {
          alert('El navegador bloqueó la ventana de impresión. Permita las ventanas emergentes para este sistema.');
          return;
        }
        ventana.document.open();
        ventana.document.write(htmlContent);
        ventana.document.close();
      })
      .withFailureHandler(function(error) {
        alert('No se pudo generar la vista de impresión: ' + error.message);
      })
      .generarHtmlImpresionGuia();
      
  }

// BUSCAR GUÍA POR CORRELATIVO

var datosGuiaEncontrada = null;


/**
 * Busca una guía ya guardada.
 *
 * IMPORTANTE:
 * Esta función NO crea una guía.
 * Esta función NO genera correlativo.
 * Esta función SOLO consulta HISTORIAL_GUIAS.
 */
function buscarGuiaPorCorrelativo() {

  var input =
    document.getElementById(
      'buscar-correlativo-guia'
    );

  var mensaje =
    document.getElementById(
      'mensaje-busqueda-guia'
    );

  var boton =
    document.getElementById(
      'btn-buscar-guia'
    );

  var resultado =
    document.getElementById(
      'resultado-guia-buscada'
    );


  if (!input) {
    return;
  }


  var correlativo =
    input.value
      .trim()
      .toUpperCase();


  if (!correlativo) {

    alert(
      'Ingrese el correlativo de la guía.'
    );

    input.focus();

    return;
  }


  if (mensaje) {

    mensaje.innerText =
      '🔍 Buscando guía...';

    mensaje.style.color =
      '#2563eb';

  }


  if (resultado) {

    resultado.style.display =
      'none';

  }


  if (boton) {

    boton.disabled = true;

    boton.innerText =
      'BUSCANDO...';

  }


  google.script.run

    .withSuccessHandler(
      function(respuesta) {

        if (boton) {

          boton.disabled = false;

          boton.innerText =
            '🔍 BUSCAR GUÍA';

        }


        if (
          !respuesta ||
          !respuesta.exito
        ) {

          datosGuiaEncontrada =
            null;

          if (mensaje) {

            mensaje.innerText =
              '❌ ' +
              (
                respuesta &&
                respuesta.mensaje
                  ? respuesta.mensaje
                  : 'No se encontró la guía.'
              );

            mensaje.style.color =
              '#dc2626';

          }

          return;
        }


        datosGuiaEncontrada =
          respuesta;


        mostrarGuiaEncontrada(
          respuesta
        );


        if (mensaje) {

          mensaje.innerText =
            '✓ Guía encontrada correctamente.';

          mensaje.style.color =
            '#16a34a';

        }

      }
    )

    .withFailureHandler(
      function(error) {

        if (boton) {

          boton.disabled = false;

          boton.innerText =
            '🔍 BUSCAR GUÍA';

        }


        if (mensaje) {

          mensaje.innerText =
            '❌ Error en el servidor: ' +
            error.message;

          mensaje.style.color =
            '#dc2626';

        }

        console.error(
          'Error buscando guía:',
          error
        );

      }
    )

    .buscarGuiaPorCorrelativo(
      correlativo
    );

}


/**
 * Muestra en pantalla la guía encontrada.
 */
function mostrarGuiaEncontrada(
  guia
) {

  var resultado =
    document.getElementById(
      'resultado-guia-buscada'
    );

  if (!resultado) {
    return;
  }


  resultado.style.display =
    'block';


  var cabecera =
    guia.cabecera || {};


  var productos =
    guia.productos || [];


  var correlativo =
    document.getElementById(
      'resultado-guia-correlativo'
    );

  var empresa =
    document.getElementById(
      'resultado-guia-empresa'
    );

  var cliente =
    document.getElementById(
      'resultado-guia-cliente'
    );

  var documento =
    document.getElementById(
      'resultado-guia-documento'
    );

  var fecha =
    document.getElementById(
      'resultado-guia-fecha'
    );

  var condicion =
    document.getElementById(
      'resultado-guia-condicion'
    );

  var tbody =
    document.getElementById(
      'tbody-guia-buscada'
    );

  var total =
    document.getElementById(
      'resultado-guia-total'
    );


  if (correlativo) {

    correlativo.innerText =
      guia.correlativo || '';

  }


  if (empresa) {

    empresa.innerText =
      (
        cabecera.empresa || ''
      ) +
      ' | RUC: ' +
      (
        cabecera.rucEmisor || ''
      );

  }


  if (cliente) {

    cliente.innerText =
      cabecera.cliente || '-';

  }


  if (documento) {

    documento.innerText =
      cabecera.documento || '-';

  }


  if (fecha) {

    fecha.innerText =
      cabecera.fechaEmision || '-';

  }


  if (condicion) {

    condicion.innerText =
      cabecera.condicion || '-';

  }


  if (tbody) {

    tbody.innerHTML = '';

  }


  var totalKilos = 0;


  productos.forEach(
    function(prod) {

      var cantidad =
        parseFloat(
          prod.cantidad
        ) || 0;


      totalKilos +=
        cantidad;


      var tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML =

        '<td style="padding:8px;">' +
          (prod.codigo || '') +
        '</td>' +

        '<td style="padding:8px;">' +
          (prod.descripcion || '') +
        '</td>' +

        '<td style="padding:8px;text-align:right;">' +
          cantidad.toFixed(3) +
        '</td>' +

        '<td style="padding:8px;text-align:center;">' +
          (prod.um || 'KG') +
        '</td>';

function cargarProductosDesdeLinkVenta() {

  var empresa = document.getElementById('venta-empresa');
  var link = document.getElementById('venta-link');
  var mensaje = document.getElementById('venta-link-mensaje');
  var boton = document.querySelector('#tab-ventas .ventas-btn-cargar-link');

  var empresaValor = empresa
    ? empresa.value.trim().toUpperCase()
    : '';

  var linkValor = link
    ? link.value.trim()
    : '';

  if (!empresaValor) {
    alert('Seleccione una empresa.');
    return;
  }

  if (!linkValor) {
    alert('Pegue el link del reporte antes de cargar los códigos.');
    return;
  }

  if (mensaje) {
    mensaje.innerText = '🔍 Leyendo información del archivo...';
    mensaje.style.color = '#2563eb';
  }

  if (boton) {
    boton.disabled = true;
    boton.innerText = 'CARGANDO...';
  }

  google.script.run

    .withSuccessHandler(function(respuesta) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '🔄 CARGAR';
      }

      if (!respuesta || !respuesta.exito) {

        productosVentaDisponibles = [];
        actualizarListaCodigosVenta();

        if (mensaje) {
          mensaje.innerText =
            '❌ ' +
            (
              respuesta && respuesta.mensaje
                ? respuesta.mensaje
                : 'No se pudieron cargar los datos.'
            );

          mensaje.style.color = '#dc2626';
        }

        return;
      }

      productosVentaDisponibles =
        respuesta.productos || [];

      actualizarListaCodigosVenta();

      // ============================================================
      // LIMPIAR TABLA ACTUAL
      // ============================================================

      var tbody =
        document.getElementById('tbody-ventas-detalle');

      if (tbody) {

        tbody.innerHTML = '';

        // ========================================================
        // CREAR AUTOMÁTICAMENTE UNA FILA POR PRODUCTO
        // ========================================================

        productosVentaDisponibles.forEach(function(producto) {

          agregarFilaVenta();

          var fila = tbody.lastElementChild;

          if (!fila) return;

          var inputs =
            fila.querySelectorAll('input');

          if (inputs.length >= 3) {

            inputs[0].value =
              producto.codigo || '';

            inputs[1].value =
              producto.descripcion || '';

            inputs[1].style.color =
              '#16a34a';

            inputs[2].value =
              producto.cantidad > 0
                ? producto.cantidad.toFixed(3)
                : '';

          }

        });

        calcularTotalVenta();
      }

      if (mensaje) {

        mensaje.innerText =
          '✓ ' +
          productosVentaDisponibles.length +
          ' productos cargados para ' +
          empresaValor +
          ' desde ' +
          (respuesta.pestaña || 'la pestaña indicada') +
          '.';

        mensaje.style.color = '#16a34a';
      }

    })

    .withFailureHandler(function(error) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '🔄 CARGAR';
      }

      if (mensaje) {
        mensaje.innerText =
          '❌ Error en el servidor: ' +
          error.message;

        mensaje.style.color = '#dc2626';
      }

    })

    .obtenerProductosDesdeLinkVenta(
      empresaValor,
      linkValor
    );
}

// ============================================================

function guardarVenta() {

  var correlativo = document.getElementById('venta-correlativo').value.trim();
  var fecha = document.getElementById('venta-fecha').value;
  var empresa = document.getElementById('venta-empresa').value.trim().toUpperCase();
  var linkOrigen = document.getElementById('venta-link').value.trim();
  var ruc = document.getElementById('venta-ruc').value.trim();
  var cliente = document.getElementById('venta-cliente').value.trim();

  if (!correlativo) {
    alert('Por favor, ingrese el correlativo.');
    return;
  }

  if (!fecha) {
    alert('Por favor, seleccione la fecha de despacho.');
    return;
  }

  if (!empresa) {
    alert('Por favor, seleccione la empresa.');
    return;
  }

  if (!linkOrigen) {
    alert('Por favor, ingrese el link de origen.');
    return;
  }

  if (!ruc) {
    alert('Por favor, ingrese el RUC.');
    return;
  }

  if (!cliente) {
    alert('Por favor, ingrese el cliente.');
    return;
  }

  var tbody = document.getElementById('tbody-ventas-detalle');

  var filas = tbody.querySelectorAll('tr');

  var detalle = [];

  for (var i = 0; i < filas.length; i++) {

    var inputs = filas[i].querySelectorAll('input');

    var codigo = inputs[0].value.trim();
    var variedad = inputs[1].value.trim();
    var kg = parseFloat(inputs[2].value) || 0;

    if (!codigo && kg === 0) {
      continue;
    }

    if (!codigo) {
      alert('Hay una línea sin código de producto.');
      return;
    }

    if (!variedad || variedad === 'Código no encontrado' || variedad === 'Código no disponible en el link') {
      alert('Verifique que todos los códigos sean válidos.');
      return;
    }

    if (kg <= 0) {
      alert('Todos los productos deben tener KG mayor a cero.');
      return;
    }

    detalle.push({
      codigo: codigo,
      variedad: variedad,
      kgTotal: kg
    });
  }

  if (detalle.length === 0) {
    alert('Debe agregar al menos un producto a la venta.');
    return;
  }

  var payload = {
    correlativo: correlativo,
    fechaDespacho: fecha,
    empresa: empresa,
    linkOrigen: linkOrigen,
    ruc: ruc,
    cliente: cliente,
    detalle: detalle
  };

  var boton = document.querySelector('#tab-ventas .ventas-btn-guardar');

  if (boton) {
    boton.disabled = true;
    boton.innerText = 'GUARDANDO...';
  }

  google.script.run
    .withSuccessHandler(function(respuesta) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '💾 GUARDAR VENTA';
      }

      if (respuesta && respuesta.exito) {

        alert(
          '¡Venta guardada correctamente!\n\n' +
          'Correlativo: ' + correlativo
        );

        limpiarFormularioVenta();

      } else {

        alert(
          '❌ ' +
          (respuesta && respuesta.mensaje
            ? respuesta.mensaje
            : 'No se pudo guardar la venta.')
        );

      }

    })
    .withFailureHandler(function(error) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '💾 GUARDAR VENTA';
      }

      alert('Error en el servidor: ' + error.message);

    })
    .guardarVenta(payload);
}

function mostrarResultadoVenta(respuesta) {

  var datos = respuesta.datos;

  if (!datos || datos.length === 0) {
    mostrarMensajeVenta('No se encontraron registros.', 'error');
    return;
  }

  var primero = datos[0];

  document.getElementById('resultado-correlativo').innerText =
    primero.correlativo || '';

  document.getElementById('resultado-fecha').innerText =
    primero.fechaDespacho || '';

  document.getElementById('resultado-empresa').innerText =
    primero.empresa || '-';

  var linkResultado = document.getElementById('resultado-link');
  if (linkResultado) {
    var urlOrigen = primero.linkOrigen || '';
    linkResultado.innerText = urlOrigen ? 'Abrir archivo' : '-';
    linkResultado.href = urlOrigen || '#';
  }

  document.getElementById('resultado-ruc').innerText =
    primero.ruc || '';

  document.getElementById('resultado-cliente').innerText =
    primero.cliente || '';

  var tbody = document.getElementById('tbody-ventas-resultado');

  tbody.innerHTML = '';

  var total = 0;

  datos.forEach(function(item) {

    var kg = parseFloat(item.kgTotal) || 0;

    total += kg;

    var tr = document.createElement('tr');

    tr.innerHTML = `
      <td>
        ${item.codigo || ''}
      </td>

      <td>
        ${item.variedad || ''}
      </td>

      <td style="text-align:right; font-weight:bold;">
        ${kg.toLocaleString('en-US', {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3
        })}
      </td>

      <td></td>
    `;

    tbody.appendChild(tr);

  });

  document.getElementById('resultado-total-kilos').innerText =
    total.toLocaleString('en-US', {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    });

  var resultado = document.getElementById('ventas-resultado');

  if (resultado) {
    resultado.classList.add('visible');
  }

  function cargarReporteDespacho(){
    var fechaInicioEl=document.getElementById('despacho-fecha-base-inicio');
    var fechaFinEl=document.getElementById('despacho-fecha-base-fin');
    var fechaInicio=fechaInicioEl ? fechaInicioEl.value : '';
    var fechaFin=fechaFinEl ? fechaFinEl.value : '';
    var empresa=document.getElementById('despacho-empresa-base').value;
    var cliente=document.getElementById('despacho-cliente-base').value;
    var status=document.getElementById('despacho-form-status');

    if(!fechaInicio||!fechaFin){alert('Seleccione la fecha de inicio y la fecha de fin.');return;}
    if(fechaInicio>fechaFin){alert('La fecha de inicio no puede ser mayor que la fecha de fin.');return;}
    if(!cliente){alert('Seleccione un cliente.');return;}

    status.textContent='🔍 Cargando reporte del rango seleccionado...';
    document.getElementById('despacho-base-contenedor').style.display='block';
    document.getElementById('despacho-base-resultado').innerHTML='<div class="despachos-empty">Consultando el reporte del '+fechaInicio.split('-').reverse().join('/')+' al '+fechaFin.split('-').reverse().join('/')+'...</div>';
    document.getElementById('despacho-cliente-banner').textContent='CLIENTE: '+cliente;

    google.script.run
      .withSuccessHandler(function(r){
        if(!r||!r.exito){
          document.getElementById('despacho-base-resultado').innerHTML='<div class="despachos-empty">Error: '+_escDespacho((r&&r.mensaje)||'No se pudo cargar el reporte.')+'</div>';
          status.textContent='';
          return;
        }

        despachoBaseActual=r.datos||[];
        if(empresa!=='TODAS')despachoBaseActual=despachoBaseActual.filter(function(x){return String(x.empresa||'').toUpperCase()===empresa;});

        renderizarBaseDespacho(despachoBaseActual, cliente, fechaInicio, fechaFin);
        status.textContent='Reporte cargado correctamente.';
      })
      .withFailureHandler(function(e){
        document.getElementById('despacho-base-resultado').innerHTML='<div class="despachos-empty">Error en el servidor: '+_escDespacho(e&&e.message?e.message:e)+'</div>';
        status.textContent='';
      })
      .obtenerBaseDespachoPorFechas(localStorage.getItem('sesion_token')||'',fechaInicio,fechaFin,empresa,cliente);
  }

  function renderizarBaseDespacho(r, cliente, fechaInicio, fechaFin){
    var cont=document.getElementById('despacho-base-resultado');
    if(!r||!r.length){
      cont.innerHTML='<div class="despachos-empty">No hay productos con kilos disponibles para despachar en el rango seleccionado.</div>';
      return;
    }

    var porEmpresa={};
    r.forEach(function(x){
      if(!porEmpresa[x.empresa])porEmpresa[x.empresa]=[];
      porEmpresa[x.empresa].push(x);
    });

    var totalDisponible=0,totalDespachado=0,totalSaldo=0;
    var html='';
    ['LARAMA','AGA','ARENUVA'].forEach(function(emp){
      if(!porEmpresa[emp])return;
      var filas=porEmpresa[emp];
      var sumaDisp=0,sumaDesp=0,sumaSaldo=0;
      var rows=filas.map(function(x,idx){
        sumaDisp+=Number(x.disponible||0);
        sumaDesp+=Number(x.despachado||0);
        sumaSaldo+=Number(x.saldo||0);
        totalDisponible+=Number(x.disponible||0);
        totalDespachado+=Number(x.despachado||0);
        totalSaldo+=Number(x.saldo||0);
        var inputId='inp-despacho-'+idx+'-'+emp.toLowerCase();
        var disabled=Number(x.saldo||0)<=0?' disabled':'';
        var tipoCls=String(x.tipo||'').toUpperCase()==='PACKING'?'tipo-packing':'tipo-campo';
        var keyData=encodeURIComponent(JSON.stringify({empresa:x.empresa,tipo:x.tipo,codigo:x.codigo,variedad:x.variedad}));
        return '<tr data-despacho-key="'+keyData+'">'+
          '<td><input type="checkbox" class="row-selector" aria-label="Seleccionar fila"></td>'+
          '<td style="font-weight:800;">'+_escDespacho(x.codigo||'-')+'</td>'+
          '<td>'+_escDespacho(x.variedad||'-')+'</td>'+
          '<td><span class="tipo-chip '+tipoCls+'">'+_escDespacho(x.tipo||'-')+'</span></td>'+
          '<td class="num">'+_kgDespacho(x.disponible)+'</td>'+
          '<td class="num">'+_kgDespacho(x.despachado)+'</td>'+
          '<td class="num '+(Number(x.saldo||0)>0?'saldo-ok':'saldo-zero')+'">'+_kgDespacho(x.saldo)+'</td>'+
          '<td class="num"><input class="input-despacho" type="number" min="0" max="'+Number(x.saldo||0).toFixed(3)+'" step="0.001" value="0.000"'+disabled+' class="input-despacho locked" data-empresa="'+_escDespacho(x.empresa)+'" data-tipo="'+_escDespacho(x.tipo)+'" data-codigo="'+_escDespacho(x.codigo)+'" data-variedad="'+_escDespacho(x.variedad)+'" data-saldo="'+Number(x.saldo||0).toFixed(3)+'"></td>'+
        '</tr>';
      }).join('');

      html+='<div class="despacho-empresa">'+
        '<div class="despacho-empresa-head"><span>'+emp+'</span><span>DISPONIBLE: '+_kgDespacho(sumaDisp)+' KG</span></div>'+
        '<div class="despachos-table-wrap"><table><thead><tr><th></th><th>CÓDIGO</th><th>VARIEDAD</th><th>TIPO</th><th>DISPONIBLE</th><th>YA DESPACHADO</th><th>SALDO</th><th>DESPACHAR (KG)</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+ 
        '<div class="despachos-total-row"><span>Despachado: <strong>'+_kgDespacho(sumaDesp)+' KG</strong></span><span>Saldo: <strong>'+_kgDespacho(sumaSaldo)+' KG</strong></span></div>'+
      '</div>';
    });

    html+='<div class="despachos-total-general"><div class="label">TOTAL DISPONIBLE · '+_escDespacho(cliente)+' · '+_escDespacho(fechaInicio.split('-').reverse().join('/'))+' al '+_escDespacho(fechaFin.split('-').reverse().join('/'))+'</div><div class="value">'+_kgDespacho(totalSaldo)+' KG</div></div>';
    cont.innerHTML=html;
    cont.querySelectorAll('.input-despacho').forEach(function(i){if(!i.disabled)i.disabled=true;i.classList.add('locked');i.addEventListener('input',actualizarTotalDespachoActual);});
    actualizarTotalDespachoActual();
    var btn=document.getElementById('btn-editar-pesos');if(btn)btn.textContent='✏️ EDITAR PESO';
  }


  function toggleEditarPesos(){

    if(btn)btn.textContent=hayEditables?'✏️ EDITAR PESO':'🔒 BLOQUEAR PESO';

  function borrarFilasDespacho(){
    var seleccion=document.querySelectorAll('#despacho-base-resultado .row-selector:checked');
    if(seleccion.length){
      seleccion.forEach(function(cb){
        var tr=cb.closest('tr');
        var input=tr?tr.querySelector('.input-despacho'):null;
        if(input) input.value='0.000';
        cb.checked=false;
      });
    }

    var body=document.getElementById('despacho-filas-extra-body');
    var wrap=document.getElementById('despacho-filas-extra');
    if(body&&body.lastElementChild&&!seleccion.length){
      body.lastElementChild.remove();
      if(!body.children.length&&wrap)wrap.style.display='none';
    }

    if(!seleccion.length && !(body&&body.lastElementChild)){
      alert('Seleccione una fila para borrar.');
      return;
    }

    actualizarTotalDespachoActual();
  }

  function guardarDespachosMasivosDesdeInterfaz(){
    var fechaInicioEl=document.getElementById('despacho-fecha-base-inicio');
    var fechaFinEl=document.getElementById('despacho-fecha-base-fin');
    var fechaInicio=fechaInicioEl ? fechaInicioEl.value : '';
    var fechaFin=fechaFinEl ? fechaFinEl.value : '';
    var cliente=document.getElementById('despacho-cliente-base').value;
    var empresaFiltro=document.getElementById('despacho-empresa-base').value;
    var inputs=document.querySelectorAll('#despacho-base-resultado .input-despacho');
    var registros=[];

    inputs.forEach(function(input){
      var kg=Number(input.value||0);
      if(kg>0){
        registros.push({
          empresa:input.dataset.empresa,
          tipo:input.dataset.tipo,
          codigo:input.dataset.codigo,
          variedad:input.dataset.variedad,
          kg:kg
        });
      }
    });

    document.querySelectorAll('#despacho-filas-extra-body tr').forEach(function(tr){
      var prod=tr.querySelector('.extra-producto');
      var opt=prod&&prod.selectedOptions?prod.selectedOptions[0]:null;
      var kg=Number((tr.querySelector('.extra-kg')||{}).value||0);
      if(opt&&opt.value&&kg>0){
        registros.push({
          empresa:(tr.querySelector('.extra-empresa')||{}).value||opt.dataset.empresa,
          tipo:(tr.querySelector('.extra-tipo')||{}).value||opt.dataset.tipo,
          codigo:opt.value,
          variedad:opt.dataset.variedad||'',
          kg:kg
        });
      }
    });

    if(!fechaInicio||!fechaFin||!cliente){alert('Seleccione fecha de inicio, fecha de fin y cliente antes de registrar.');return;}
    if(fechaInicio>fechaFin){alert('La fecha de inicio no puede ser mayor que la fecha de fin.');return;}
    if(empresaFiltro!=='TODAS' && registros.some(function(r){return String(r.empresa||'').toUpperCase()!==String(empresaFiltro).toUpperCase();})){alert('Hay productos de otra empresa seleccionada. Vuelva a cargar el reporte.');return;}
    if(!registros.length){alert('Ingrese al menos una cantidad mayor a 0 en DESPACHAR (KG).');return;}

    var btns=document.querySelectorAll('#despacho-base-contenedor button');
    btns.forEach(function(b){b.disabled=true;});
    document.getElementById('despacho-form-status').textContent='💾 Registrando despachos...';

    google.script.run
      .withSuccessHandler(function(r){
        btns.forEach(function(b){b.disabled=false;});
        if(!r||!r.exito){
          document.getElementById('despacho-form-status').textContent=(r&&r.mensaje)||'No se pudieron registrar los despachos.';
          return;
        }
        document.getElementById('despacho-form-status').textContent='✓ '+r.mensaje+' · '+r.registros+' líneas registradas.';
        cargarReporteDespacho();
        buscarDespachosAdmin();
      })
      .withFailureHandler(function(e){
        btns.forEach(function(b){b.disabled=false;});
        document.getElementById('despacho-form-status').textContent='Error: '+(e&&e.message?e.message:e);
      })
      .guardarDespachosMasivosPorRango(localStorage.getItem('sesion_token')||'',fechaInicio,fechaFin,cliente,registros);
  }

  function renderizarDespachosAdmin(r){
    var cont=document.getElementById('despachos-resultado-admin');
    if(!r||!r.exito||!r.datos||!r.datos.length){
      despachosConsultaActual=[];
      cont.innerHTML='<div class="despachos-empty">No hay despachos para los filtros seleccionados.</div>';
      return;
    }

    despachosConsultaActual=r.datos.slice();
    var grupos={},resumenClientes={},totalGeneral=0;
    r.datos.forEach(function(x){
      var grupo=x.grupoDespacho||x.id||('SIN-GRUPO-'+x.fecha+'-'+x.cliente+'-'+x.codigo);
      if(!grupos[x.empresa])grupos[x.empresa]={};
      if(!grupos[x.empresa][x.cliente])grupos[x.empresa][x.cliente]={};
      if(!grupos[x.empresa][x.cliente][grupo])grupos[x.empresa][x.cliente][grupo]=[];
      grupos[x.empresa][x.cliente][grupo].push(x);
      if(!resumenClientes[x.cliente])resumenClientes[x.cliente]=0;
      resumenClientes[x.cliente]+=Number(x.kg||0);
      totalGeneral+=Number(x.kg||0);
    });

    var html='';
    ['LARAMA','AGA','ARENUVA'].forEach(function(emp){
      if(!grupos[emp])return;
      var totalEmpresa=0,clientesHtml='';
      Object.keys(grupos[emp]).sort().forEach(function(cliente){
        Object.keys(grupos[emp][cliente]).sort().forEach(function(grupo){
          var filas=grupos[emp][cliente][grupo],totalDespacho=0;
          var corr=String(filas[0].correlativo||'').trim();
          var fecha=filas[0].fecha||'';
          var rows=filas.map(function(x){
            var kg=Number(x.kg||0);
            totalDespacho+=kg;
            return '<tr><td>'+_escDespacho(x.fecha)+'</td><td style="font-weight:800;">'+_escDespacho(x.codigo)+'</td><td>'+_escDespacho(x.variedad||'-')+'</td><td>'+_escDespacho(x.tipo||'-')+'</td><td class="num">'+_kgDespacho(kg)+'</td></tr>';
          }).join('');
          totalEmpresa+=totalDespacho;
          var corrTexto=corr?corr:'SIN ASIGNAR';
          var botonCorr=corr
            ? '<button type="button" class="despacho-mini-btn" onclick="editarCorrelativoDespacho('+JSON.stringify(grupo).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+','+JSON.stringify(emp).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+')">✏️ EDITAR CORRELATIVO</button>'
            : '<button type="button" class="despacho-mini-btn despacho-mini-btn-primary" onclick="editarCorrelativoDespacho('+JSON.stringify(grupo).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+','+JSON.stringify(emp).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+')">＋ AGREGAR CORRELATIVO</button>';
          var guiaBtn='<button type="button" class="despacho-mini-btn despacho-mini-btn-guide" onclick="abrirGuiaDesdeDespacho('+JSON.stringify(grupo).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+','+JSON.stringify(emp).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+')">📄 GUÍA PROVISIONAL</button>';
          clientesHtml+='<div class="despacho-cliente despacho-registro-card">'+
            '<div class="despacho-registro-head">'+
              '<div><div class="despacho-cliente-title">CLIENTE: '+_escDespacho(cliente)+'</div><div class="despacho-registro-meta">FECHA: '+_escDespacho(fecha)+' · ID: '+_escDespacho(grupo)+'</div></div>'+
              '<div class="despacho-registro-actions"><span class="despacho-corr-chip '+(corr?'asignado':'sin-asignar')+'">CORRELATIVO: '+_escDespacho(corrTexto)+'</span>'+botonCorr+guiaBtn+'</div>'+
            '</div>'+
            '<div class="despachos-table-wrap"><table><thead><tr><th>FECHA</th><th>CÓDIGO</th><th>VARIEDAD</th><th>TIPO</th><th>KG</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
            '<div class="despacho-total">TOTAL DESPACHO: '+_kgDespacho(totalDespacho)+' KG</div>'+
          '</div>';
        });
      });
      html+='<div class="despacho-empresa"><div class="despacho-empresa-head"><span>'+emp+'</span><span>'+_kgDespacho(totalEmpresa)+' KG</span></div>'+clientesHtml+'</div>';
    });

    html+='<div class="despachos-card" style="margin-top:12px;"><div class="despachos-card-title">RESUMEN POR CLIENTE</div><div class="despachos-clientes-resumen">';
    Object.keys(resumenClientes).sort().forEach(function(cliente){html+='<div class="cliente-resumen-card"><div class="nombre">'+_escDespacho(cliente)+'</div><div class="kg">'+_kgDespacho(resumenClientes[cliente])+' KG</div></div>';});
    html+='</div><div class="despachos-total-general"><div class="label">TOTAL GENERAL DESPACHADO</div><div class="value">'+_kgDespacho(totalGeneral)+' KG</div></div></div>';
    cont.innerHTML=html;
  }

  function editarCorrelativoDespacho(grupo, empresa){
    var actual='';
    var empresaSeleccionada=String(empresa||'').trim().toUpperCase();
    for(var i=0;i<despachosConsultaActual.length;i++){
      var filaGrupo=despachosConsultaActual[i].grupoDespacho||despachosConsultaActual[i].id||'';
      var filaEmpresa=String(despachosConsultaActual[i].empresa||'').trim().toUpperCase();
      if(String(filaGrupo)===String(grupo) && filaEmpresa===empresaSeleccionada){actual=String(despachosConsultaActual[i].correlativo||'').trim();break;}
    }
    var nuevo=window.prompt('Ingrese el correlativo del despacho de '+empresaSeleccionada+':',actual);
    if(nuevo===null)return;
    nuevo=nuevo.trim();
    if(!nuevo){alert('El correlativo no puede quedar vacío.');return;}
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||!r.exito){alert((r&&r.mensaje)||'No se pudo guardar el correlativo.');return;}
        buscarDespachosAdmin();
      })
      .withFailureHandler(function(e){alert('Error al guardar el correlativo: '+(e&&e.message?e.message:e));})
      .asignarCorrelativoDespacho(localStorage.getItem('sesion_token')||'',grupo,empresaSeleccionada,nuevo);
  }

  function abrirGuiaDesdeDespacho(grupo, empresa){
    var empresaSeleccionada=String(empresa||'').trim().toUpperCase();
    var filas=despachosConsultaActual.filter(function(x){
      var filaGrupo=String(x.grupoDespacho||x.id||'');
      var filaEmpresa=String(x.empresa||'').trim().toUpperCase();
      return filaGrupo===String(grupo) && filaEmpresa===empresaSeleccionada;
    });
    if(!filas.length){alert('No se encontró el despacho seleccionado para la empresa '+empresaSeleccionada+'.');return;}

    var emp=String(filas[0].empresa||empresaSeleccionada).trim().toUpperCase();
    var cliente=filas[0].cliente||'';
    var fecha=filas[0].fecha||'';
    var btnGuia=document.createElement('button');
    btnGuia.type='button';
    cambiarPestana({currentTarget:btnGuia},'tab-guias');

    var empresaSelect=document.getElementById('reg-empresa');
    var clienteInput=document.getElementById('reg-cliente');
    var fechaInput=document.getElementById('reg-fecha-emision');
    var vencInput=document.getElementById('reg-fecha-vencimiento');
    var tbody=document.getElementById('tbody-detalle-guias');

    if(empresaSelect)empresaSelect.value=emp;
    if(clienteInput)clienteInput.value=cliente;
    cargarDatosClienteGuia(cliente);
    if(fechaInput && fecha){var pf=fecha.split('/');if(pf.length===3)fechaInput.value=pf[2]+'-'+pf[1]+'-'+pf[0];}
    if(vencInput && fechaInput)vencInput.value=fechaInput.value;
    if(typeof actualizarEmpresaEmisora==='function')actualizarEmpresaEmisora();

    if(tbody){
      tbody.innerHTML='';
      filas.forEach(function(x){
        if(typeof agregarFilaProducto!=='function')return;
        agregarFilaProducto();
        var tr=tbody.lastElementChild;
        if(!tr)return;
        var inputs=tr.querySelectorAll('input');
        if(inputs[0])inputs[0].value=x.codigo||'';
        if(inputs[1])inputs[1].value=x.producto||x.variedad||'';
        if(inputs[2])inputs[2].value=Number(x.kg||0).toFixed(3);
      });
      if(typeof calcularTotalKilosEnVivo==='function')calcularTotalKilosEnVivo();
    }

    document.getElementById('txt-titulo-pestana').innerText='Despachos · Guía Provisional';
    var menuDesp=document.getElementById('menu-despachos');
    document.querySelectorAll('.menu-item').forEach(function(b){b.classList.remove('active');});
    if(menuDesp)menuDesp.classList.add('active');
  }

  function volverADespachosDesdeGuia(){
    var guia=document.getElementById('tab-guias');
    var despacho=document.getElementById('tab-despachos');
    var menuDesp=document.getElementById('menu-despachos');
    if(guia)guia.classList.remove('active');
    if(despacho)despacho.classList.add('active');
    document.querySelectorAll('.menu-item').forEach(function(b){b.classList.remove('active');});
    if(menuDesp)menuDesp.classList.add('active');
    document.getElementById('txt-titulo-pestana').innerText='Módulo de Despachos';
    var principal=document.querySelector('.main-content');
    if(principal)principal.scrollTop=0;
  }
