<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    inicializarDashboard();
  });

  function inicializarDashboard() {
    var usuario = localStorage.getItem('sesion_usuario') || 'Usuario';
    var empresa = localStorage.getItem('sesion_empresa') || 'General';
    
    document.getElementById('lbl-nombre-usuario').innerText = usuario;
    document.getElementById('lbl-empresa-usuario').innerText = "Empresa: " + empresa;
    
    var opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('txt-fecha-actual').innerText = new Date().toLocaleDateString('es-ES', opciones);
  }

  function cambiarPestana(evento, idTab) {
    var contenidos = document.getElementsByClassName("tab-content");
    for (var i = 0; i < contenidos.length; i++) {
      contenidos[i].classList.remove("active");
    }

    var botones = document.getElementsByClassName("menu-item");
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove("active");
    }

    document.getElementById(idTab).classList.add("active");
    evento.currentTarget.classList.add("active");

    var titulos = {
      'tab-dashboard': 'Dashboard General',
      'tab-reporte': 'Módulo de Reportes',
      'tab-cruce': 'Cruce de Stocks',
      'tab-guias': 'Emisión de Guías Provisionales'
      'tab-ventas': 'Módulo de Ventas'
    };
    document.getElementById('txt-titulo-pestana').innerText = titulos[idTab];

  if (idTab === 'tab-guias') {
    inicializarModuloGuias();
}

if (idTab === 'tab-ventas') {
    inicializarModuloVentas();
}

  var datosReporteActual = [];

  function buscarReportes() {
    var fInicio = document.getElementById('fecha-inicio').value;
    var fFin = document.getElementById('fecha-fin').value;
    
    if (!fInicio || !fFin) {
      alert("Por favor, seleccione ambas fechas para realizar la búsqueda.");
      return;
    }
    
    // Cambiamos el texto de la fecha de reporte mientras carga, sin borrar el HTML
    document.getElementById('lbl-fecha-reporte').innerText = "🔍 Cargando...";
    
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta.exito) {
          alert("❌ " + respuesta.mensaje);
          document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";
          return;
        }
        
        if (!respuesta.datos || respuesta.datos.length === 0) {
          alert("⚠️ " + (respuesta.mensaje || "No hay datos para este rango."));
          borrarReportes();
          return;
        }
        
        datosReporteActual = respuesta.datos;
        renderizarReporteVisual(respuesta.datos);
      })
      .withFailureHandler(function(err) {
        alert("Error en el servidor: " + err.message);
        document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";
      })
      .obtenerDatosReportePorFechas(fInicio, fFin);
  }

  function renderizarReporteVisual(datos) {
    // 1. Actualizar fecha de reporte en el badge
    var fInicio = document.getElementById('fecha-inicio').value;
    var fFin = document.getElementById('fecha-fin').value;
    if (fFin) {
      var partesF = fFin.split("-");
      if (partesF.length === 3) {
        document.getElementById('lbl-fecha-reporte').innerText = partesF[2] + '/' + partesF[1] + '/' + partesF[0];
      }
    }

    var empresas = ["LARAMA", "AGA", "ARENUVA"];
    var totalGeneralKilos = 0;

    empresas.forEach(function(emp) {
      var empLower = emp.toLowerCase();
      var filasEmpresa = datos.filter(d => (d.empresa || '').toUpperCase() === emp);

      // Filtrar filas por tipo de descarte
      var campoRows = filasEmpresa.filter(r => (r.presentacion || '').toUpperCase().includes("CAMPO"));
      var packingRows = filasEmpresa.filter(r => (r.presentacion || '').toUpperCase().includes("PACKING"));

      var tbodyCampo = document.querySelector('#tabla-' + empLower + '-campo tbody');
      var tbodyPacking = document.querySelector('#tabla-' + empLower + '-packing tbody');

      var subtotalCampo = 0;
      var subtotalPacking = 0;

      // --- 1. PROCESAR TABLA CAMPO ---
      if (tbodyCampo) {
        tbodyCampo.innerHTML = "";
        if (campoRows.length === 0) {
          tbodyCampo.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:10px;">Sin datos</td></tr>';
        } else {
          var htmlCampo = "";
          campoRows.forEach(function(r) {
            var peso = parseFloat(r.peso || 0);
            subtotalCampo += peso;
            htmlCampo += '<tr>' +
              '<td>' + (r.fecha || '') + '</td>' +
              '<td>' + (r.planta || '') + '</td>' +
              '<td>' + (r.presentacion || '') + '</td>' +
              '<td>' + (r.variedad || '') + '</td>' +
              '<td style="text-align:right; font-weight:bold;">' + peso.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
            '</tr>';
          });

          // Fila Subtotal Campo
          htmlCampo += '<tr style="border-top: 2px solid #cbd5e1; font-weight: bold; background-color: #f8fafc;">' +
            '<td colspan="4" style="color: #475569; text-transform: uppercase;">TOTAL DESCARTE CAMPO</td>' +
            '<td style="text-align:right; font-weight:900;">' + subtotalCampo.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
          '</tr>';

          tbodyCampo.innerHTML = htmlCampo;
        }
      }

      // --- 2. PROCESAR TABLA PACKING ---
      if (tbodyPacking) {
        tbodyPacking.innerHTML = "";
        if (packingRows.length === 0) {
          tbodyPacking.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:10px;">Sin datos</td></tr>';
        } else {
          var htmlPacking = "";
          packingRows.forEach(function(r) {
            var peso = parseFloat(r.peso || 0);
            subtotalPacking += peso;
            htmlPacking += '<tr>' +
              '<td>' + (r.fecha || '') + '</td>' +
              '<td>' + (r.planta || '') + '</td>' +
              '<td>' + (r.presentacion || '') + '</td>' +
              '<td>' + (r.variedad || '') + '</td>' +
              '<td style="text-align:right; font-weight:bold;">' + peso.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
            '</tr>';
          });

          // Fila Subtotal Packing
          htmlPacking += '<tr style="border-top: 2px solid #cbd5e1; font-weight: bold; background-color: #f8fafc;">' +
            '<td colspan="4" style="color: #475569; text-transform: uppercase;">TOTAL DESCARTE PACKING</td>' +
            '<td style="text-align:right; font-weight:900;">' + subtotalPacking.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + '</td>' +
          '</tr>';

          tbodyPacking.innerHTML = htmlPacking;
        }
      }

      // --- 3. ACTUALIZAR TOTAL EMPRESA ---
      var totalEmpresa = subtotalCampo + subtotalPacking;
      totalGeneralKilos += totalEmpresa;

      var elemTotalEmpresa = document.getElementById('total-' + empLower);
      if (elemTotalEmpresa) {
        elemTotalEmpresa.innerText = totalEmpresa.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3});
      }
    });

    // --- 4. ACTUALIZAR BANNER TOTAL GENERAL ---
    var elemTotalGeneral = document.getElementById('total-general-kilos');
    if (elemTotalGeneral) {
      elemTotalGeneral.innerText = totalGeneralKilos.toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3});
    }
  }


  function renderizarTablasCruce(datos, stockTotal) {
    var tbodyCampo = document.querySelector('#tabla-cruce-campo tbody');
    var tbodyPacking = document.querySelector('#tabla-cruce-packing tbody');

    tbodyCampo.innerHTML = "";
    tbodyPacking.innerHTML = "";

    var campoFilas = datos.filter(d => d.grupo === "CAMPO");
    var packingFilas = datos.filter(d => d.grupo === "PACKING");

    var armarFilasHtml = function(lista) {
      var html = "";
      var sumaSispacking = 0;
      var sumaSap = 0;
      var sumaDiferencia = 0;

      lista.forEach(function(r) {
        var estiloCeldaDif = "font-weight:bold;";
        var valorSispacking = parseFloat(r.sispacking || 0);
        var valorSap = parseFloat(r.sap || 0);
        
        var difReal = valorSap - valorSispacking;
        sumaSispacking += valorSispacking;
        sumaSap += valorSap;
        sumaDiferencia += difReal;

        /*
         * DIFERENCIA:
         * Positiva  = sobra       -> verde
         * Negativa  = diferencia  -> rojo
         * Cero      = neutro
         *
         * Se utiliza !important porque el CSS de Interfaz.html
         * establece background:#ffffff !important para las celdas.
         */
        if (difReal > 0) {
          estiloCeldaDif += " background-color: #d4edda !important; color: #155724 !important;";
        } else if (difReal < 0) {
          estiloCeldaDif += " background-color: #f8d7da !important; color: #721c24 !important;";
        } else {
          estiloCeldaDif += " background-color: #ffffff !important; color: #334155 !important;";
        }

        html += '<tr>' +
          '<td>' + (r.empresa || '') + '</td>' +
          '<td style="font-weight: bold; color: #475569;">' + (r.codigo || '-') + '</td>' +
          '<td>' + (r.fecha || '') + '</td>' +
          '<td style="white-space:nowrap;">' + (r.variedad || '') + '</td>' +
          '<td>' + (r.tipoDescarte || '') + '</td>' +
          '<td style="text-align:right;">' + valorSispacking.toFixed(3) + '</td>' +
          '<td style="text-align:right;">' + valorSap.toFixed(3) + '</td>' +
          '<td style="' + estiloCeldaDif + ' text-align:right;">' + difReal.toFixed(3) + '</td>' +
        '</tr>';
      });

      /*
       * TOTAL DIFERENCIA:
       * Positiva  = verde
       * Negativa  = rojo
       * Cero      = neutro
       */
      var estiloTotalDif = "font-weight:bold; text-align:right;";

      if (sumaDiferencia > 0) {
        estiloTotalDif += " background-color: #d4edda !important; color: #155724 !important;";
      } else if (sumaDiferencia < 0) {
        estiloTotalDif += " background-color: #f8d7da !important; color: #721c24 !important;";
      } else {
        estiloTotalDif += " background-color: #ffffff !important; color: #334155 !important;";
      }

      html += '<tr style="background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #cbd5e1;">' +
        '<td colspan="5" style="text-align: center;">TOTALES</td>' +
        '<td style="text-align:right;">' + sumaSispacking.toFixed(3) + '</td>' +
        '<td style="text-align:right;">' + sumaSap.toFixed(3) + '</td>' +
        '<td style="' + estiloTotalDif + '">' + sumaDiferencia.toFixed(3) + '</td>' +
      '</tr>';

      return html;
    };

    tbodyCampo.innerHTML = armarFilasHtml(campoFilas);
    tbodyPacking.innerHTML = armarFilasHtml(packingFilas);

    // RENDERIZAR TABLA DE STOCK TOTAL (COLUMNA J)
    var tbodyStock = document.getElementById('tbodyStockTotal');
    if (tbodyStock) {
      tbodyStock.innerHTML = "";
      if (!stockTotal || stockTotal.length === 0) {
        tbodyStock.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#64748b;">No hay registros de Stock Total para el período.</td></tr>';
      } else {
        stockTotal.forEach(function(st) {
          var tr = document.createElement("tr");
          tr.innerHTML = 
            "<td>" + st.empresa + "</td>" +
            "<td>" + st.codigo + "</td>" +
            "<td>" + st.variedad + "</td>" +
            "<td>" + st.tipoDescarte + "</td>" +
            "<td style='font-weight:bold; color:#0d6efd; text-align:right;'>" + Number(st.stockTotal).toLocaleString('en-US', {minimumFractionDigits: 3, maximumFractionDigits: 3}) + "</td>";
          tbodyStock.appendChild(tr);
        });
      }
    }
  }


  function borrarReportes() {
    document.getElementById('fecha-inicio').value = "";
    document.getElementById('fecha-fin').value = "";
    document.getElementById('lbl-fecha-reporte').innerText = "--/--/----";

    var empresas = ["larama", "aga", "arenuva"];
    empresas.forEach(function(emp) {
      var tbCampo = document.querySelector('#tabla-' + emp + '-campo tbody');
      var tbPacking = document.querySelector('#tabla-' + emp + '-packing tbody');

      if (tbCampo) tbCampo.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:10px;">Sin datos</td></tr>';
      if (tbPacking) tbPacking.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:10px;">Sin datos</td></tr>';

      var lblTot = document.getElementById('total-' + emp);
      if (lblTot) lblTot.innerText = "0.000";
    });

    document.getElementById('total-general-kilos').innerText = "0.000";
    datosReporteActual = [];
  }


  function copiarCruce() {
    if (datosCruceGlobal.length === 0) {
      alert("No hay datos cargados en el cruce para copiar.");
      return;
    }

    var txt = "EMPRESA\tCÓDIGO\tFECHA\tVARIEDAD\tTIPO DESCARTE\tSISPACKING (KG)\tSAP (KG)\tDIFERENCIA\n";

    datosCruceGlobal.forEach(function(r) {
      var codigoProducto = r.codigo || '-';

      txt += (r.empresa || '') + "\t" + 
             codigoProducto + "\t" + 
             (r.fecha || '') + "\t" + 
             (r.variedad || '') + "\t" + 
             (r.tipoDescarte || '') + "\t" + 
             (r.sispacking || 0) + "\t" + 
             (r.sap || 0) + "\t" + 
             (r.diferencia || 0) + "\n";
    });

    var temp = document.createElement("textarea");
    temp.value = txt;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    document.body.removeChild(temp);

    alert("¡Cruce de stocks copiado con éxito para Excel!");
  }


  // MÓDULO GUÍAS PROVISIONALES
  function inicializarModuloGuias() {
    document.getElementById('reg-cliente').value = '';
    document.getElementById('reg-documento').value = '';
    document.getElementById('reg-direccion').value = '';
    document.getElementById('reg-observaciones').value = '';
    
    var tbody = document.getElementById('tbody-detalle-guias');

    if (tbody) {
      tbody.innerHTML = '';
      agregarFilaProducto();
    }

    if (document.getElementById('txt-total-kilos')) {
      document.getElementById('txt-total-kilos').innerText = "0.000";
    }

    google.script.run
      .withSuccessHandler(function(siguienteCorrelativo) {
        var lblCorr = document.getElementById('txt-correlativo');

        if (lblCorr) {
          lblCorr.innerText = siguienteCorrelativo;
        }
      })
      .obtenerSiguienteCorrelativo();
  }


  function agregarFilaProducto() {
    var tbody = document.getElementById('tbody-detalle-guias');
    var tr = document.createElement('tr');

    tr.style.borderBottom = "1px solid #f1f5f9";
    
    tr.innerHTML = `
      <td style="padding: 8px 10px;">
        <input type="text" class="input-codigo-prod" oninput="escucharCambioCodigo(this)" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-size:12px;" placeholder="Escriba código...">
      </td>

      <td style="padding: 8px 10px;">
        <input type="text" class="input-desc-prod" style="width:100%; padding:8px; border:none; background:transparent; font-weight:bold; color:#334155; font-size:12px;" readonly value="Proceda a buscar...">
      </td>

      <td style="padding: 8px 10px;">
        <input type="number" class="input-cant-prod" oninput="calcularTotalKilosEnVivo()" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; text-align:right; font-size:12px; font-weight:bold;" value="0.000" step="0.001">
      </td>

      <td style="padding: 8px 10px;">
        <input type="text" style="width:100%; padding:8px; border:none; background:transparent; text-align:center; font-size:12px; color:#64748b;" value="KG" readonly>
      </td>

      <td style="text-align:center; padding: 8px 5px;">
        <button type="button" onclick="removerFilaYRecalcular(this);" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer; font-size:14px;">X</button>
      </td>
    `;
    
    tbody.appendChild(tr);
  }


  function escucharCambioCodigo(inputElement) {
    var codigoInput = inputElement.value.trim();
    var fila = inputElement.closest('tr');
    var descInput = fila.querySelector('.input-desc-prod');
    
    if (codigoInput.length === 0) {
      descInput.value = "Proceda a buscar...";
      return;
    }
    
    descInput.value = "🔍 Buscando...";
    descInput.style.color = "#2563eb";

    google.script.run
      .withSuccessHandler(function(resultado) {
        descInput.value = resultado.descripcion;

        if (resultado.exito) {
          descInput.style.color = "#16a34a";
        } else {
          descInput.style.color = "#dc2626";
        }
      })
      .buscarProductoPorCodigo(codigoInput);
  }


  function calcularTotalKilosEnVivo() {
    var total = 0;
    var camposCantidad = document.querySelectorAll('.input-cant-prod');
    
    camposCantidad.forEach(function(input) {
      var valor = parseFloat(input.value) || 0;
      total += valor;
    });

    document.getElementById('txt-total-kilos').innerText = total.toFixed(3);
  }


  function removerFilaYRecalcular(boton) {
    boton.closest('tr').remove();
    calcularTotalKilosEnVivo();
  }


  function actualizarEmpresaEmisora() {
    var codEmpresa = document.getElementById('reg-empresa').value;
    var banner = document.getElementById('banner-emisor-fiscal');
    var txtSocial = document.getElementById('txt-emisor-social');
    var txtRuc = document.getElementById('txt-emisor-ruc');
    
    if (!codEmpresa) {
      banner.style.display = "none";
      return;
    }
    
    google.script.run
      .withSuccessHandler(function(datos) {
        if (datos.razonSocial) {
          txtSocial.innerText = datos.razonSocial;
          txtRuc.innerText = "RUC: " + datos.ruc;
          banner.style.display = "block";
        } else {
          banner.style.display = "none";
        }
      })
      .obtenerDatosEmpresaEmisora(codEmpresa);
  }


  function limpiarFormularioGuia() {
    if (confirm("¿Está seguro de limpiar todo el formulario de la guía actual?")) {
      inicializarModuloGuias();
    }
  }


  /**
   * Procesa el guardado de la Guía de Remisión y abre la ventana de impresión.
   */
  function procesarGuardadoGuia() {
    var empresa = document.getElementById('select-empresa').value;
    var correlativo = document.getElementById('input-correlativo').value;
    var fecha = document.getElementById('input-fecha').value;
    var chofer = document.getElementById('input-chofer').value;
    var placa = document.getElementById('input-placa').value;
    var observaciones = document.getElementById('input-observaciones').value;

    if (!fecha || !chofer || !placa) {
      alert("Por favor complete los campos obligatorios: Fecha, Chofer y Placa.");
      return;
    }

    // Mapeo unificado de datos de empresa emisora
    var datosEmpresas = {
      "AGA": { ruc: "20505688903", razon: "AGRÍCOLA ANDREA S.A.C." },
      "ARENUVA": { ruc: "20607519391", razon: "ARENUVA S.A.C." },
      "LARAMA": { ruc: "20602842739", razon: "LARAMA BERRIES S.A.C." }
    };

    var infoEmpresa = datosEmpresas[empresa] || { ruc: "", razon: empresa };

    // Recolección de productos ingresados en la tabla
    var productos = [];
    var filas = document.querySelectorAll('#tbody-productos-guia tr');
    
    filas.forEach(function(fila) {
      var codigo = fila.querySelector('.input-cod-prod') ? fila.querySelector('.input-cod-prod').value : '';
      var descripcion = fila.querySelector('.input-desc-prod') ? fila.querySelector('.input-desc-prod').value : '';
      var cantidad = fila.querySelector('.input-cant-prod') ? fila.querySelector('.input-cant-prod').value : 0;
      var um = fila.querySelector('.select-um-prod') ? fila.querySelector('.select-um-prod').value : 'NIU';

      if (descripcion.trim() !== '' && cantidad > 0) {
        productos.push({
          codigo: codigo,
          descripcion: descripcion,
          cantidad: parseFloat(cantidad),
          um: um
        });
      }
    });

    if (productos.length === 0) {
      alert("Debe agregar al menos un producto con descripción y cantidad mayor a 0.");
      return;
    }

    var payload = {
      empresaCodigo: empresa,
      empresaRuc: infoEmpresa.ruc,
      empresaRazon: infoEmpresa.razon,
      correlativo: correlativo,
      fecha: fecha,
      chofer: chofer,
      placa: placa,
      observaciones: observaciones,
      productos: productos
    };

    // Mostrar indicador de carga
    mostrarCargando(true);

    // Guardar en Apps Script Backend
    google.script.run
      .withSuccessHandler(function(respuesta) {
        mostrarCargando(false);

        if (respuesta && respuesta.exito) {
          alert("¡Guía guardada exitosamente con el correlativo: " + respuesta.correlativo + "!");
          
          // Abrir la ventana de impresión con los datos procesados
          imprimirGuia(payload);
          
          // Limpiar el formulario o recargar correlativo
          limpiarFormularioGuia();
        } else {
          alert("Error al guardar la guía: " + (respuesta.mensaje || "Error desconocido."));
        }
      })
      .withFailureHandler(function(err) {
        mostrarCargando(false);
        alert("Error en el servidor: " + err.message);
      })
      .guardarGuiaProvisional(payload);
  }


  /**
   * Genera la vista previa / ventana de impresión de la guía.
   */
  function imprimirGuia(datos) {
    google.script.run
      .withSuccessHandler(function(htmlContent) {
        var ventana = window.open('', '_blank', 'width=900,height=700');
        ventana.document.write(htmlContent);
        ventana.document.close();
      })
      .generarHtmlImpresionGuia(datos);
  }


  // Variable global para almacenar el cruce y poder copiarlo a Excel
  var datosCruceGlobal = [];


  function buscarCruceStocks() {
    var empresa = document.getElementById('cruce-empresa').value;
    var fInicio = document.getElementById('cruce-fecha-inicio').value;
    var fFin = document.getElementById('cruce-fecha-fin').value;

    if (!fInicio || !fFin) {
      alert("Por favor, seleccione ambas fechas para realizar la búsqueda.");
      return;
    }

    // Mensaje visual de carga en las tablas
    var tbodyCampo = document.querySelector('#tabla-cruce-campo tbody');
    var tbodyPacking = document.querySelector('#tabla-cruce-packing tbody');
    
    if (tbodyCampo) {
      tbodyCampo.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">🔍 Cargando datos de Campo...</td></tr>';
    }

    if (tbodyPacking) {
      tbodyPacking.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">🔍 Cargando datos de Packing...</td></tr>';
    }

    // Llamada al backend (Código.gs -> obtenerCruceStocks)
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta.exito) {
          alert("❌ " + respuesta.mensaje);
          return;
        }

        datosCruceGlobal = respuesta.datos || [];
        
        // Llamamos a la función que ya tienes programada para pintar los datos
        renderizarTablasCruce(respuesta.datos, respuesta.stockTotal);
      })
      .withFailureHandler(function(err) {
        alert("Error en el servidor: " + err.message);
      })
      .obtenerCruceStocks(empresa, fInicio, fFin);
  }


  function borrarCruce() {
    document.getElementById('cruce-fecha-inicio').value = "";
    document.getElementById('cruce-fecha-fin').value = "";
    
    var tbodyCampo = document.querySelector('#tabla-cruce-campo tbody');
    var tbodyPacking = document.querySelector('#tabla-cruce-packing tbody');
    var tbodyStock = document.getElementById('tbodyStockTotal');

    if (tbodyCampo) {
      tbodyCampo.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">Cargando comparativas de Campo...</td></tr>';
    }

    if (tbodyPacking) {
      tbodyPacking.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">Cargando comparativas de Packing...</td></tr>';
    }

    if (tbodyStock) {
      tbodyStock.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px;" class="text-muted">Presione "BUSCAR" para obtener la información de stocks.</td></tr>';
    }

    datosCruceGlobal = [];
  }
  // ============================================================
// MÓDULO VENTAS
// ============================================================

function inicializarModuloVentas() {

  var fecha = document.getElementById('venta-fecha');

  if (fecha && !fecha.value) {
    var hoy = new Date();
    var anio = hoy.getFullYear();
    var mes = String(hoy.getMonth() + 1).padStart(2, '0');
    var dia = String(hoy.getDate()).padStart(2, '0');

    fecha.value = anio + '-' + mes + '-' + dia;
  }

  var tbody = document.getElementById('tbody-ventas-detalle');

  if (tbody && tbody.children.length === 0) {
    agregarFilaVenta();
  }
}


// ============================================================
// AGREGAR FILA DE PRODUCTO
// ============================================================

function agregarFilaVenta() {

  var tbody = document.getElementById('tbody-ventas-detalle');

  if (!tbody) return;

  var tr = document.createElement('tr');

  tr.innerHTML = `
    <td>
      <input
        type="text"
        class="ventas-input"
        placeholder="Ingrese código..."
        oninput="escucharCambioCodigoVenta(this)"
      >
    </td>

    <td>
      <input
        type="text"
        class="ventas-input ventas-input-variedad"
        placeholder="Buscando..."
        readonly
      >
    </td>

    <td>
      <input
        type="number"
        class="ventas-input ventas-input-kg"
        placeholder="0.000"
        min="0"
        step="0.001"
        oninput="calcularTotalVenta()"
      >
    </td>

    <td style="text-align:center;">
      <button
        type="button"
        class="ventas-btn-eliminar"
        onclick="eliminarFilaVenta(this)"
      >
        ×
      </button>
    </td>
  `;

  tbody.appendChild(tr);
}


// ============================================================
// ELIMINAR FILA
// ============================================================

function eliminarFilaVenta(boton) {

  var tbody = document.getElementById('tbody-ventas-detalle');

  if (!tbody) return;

  var filas = tbody.querySelectorAll('tr');

  if (filas.length <= 1) {
    filas[0].querySelectorAll('input').forEach(function(input) {
      input.value = '';
    });

    calcularTotalVenta();
    return;
  }

  boton.closest('tr').remove();

  calcularTotalVenta();
}


// ============================================================
// BUSCAR VARIEDAD POR CÓDIGO
// Utiliza la función existente del backend:
// buscarProductoPorCodigo()
// ============================================================

function escucharCambioCodigoVenta(codigoInput) {

  var fila = codigoInput.closest('tr');

  if (!fila) return;

  var inputs = fila.querySelectorAll('input');

  var variedadInput = inputs[1];

  var codigo = codigoInput.value.trim();

  if (!codigo) {
    variedadInput.value = '';
    variedadInput.style.color = '#334155';
    return;
  }

  variedadInput.value = '🔍 Buscando...';
  variedadInput.style.color = '#2563eb';

  google.script.run
    .withSuccessHandler(function(resultado) {

      if (resultado && resultado.exito) {

        variedadInput.value = resultado.descripcion || '';
        variedadInput.style.color = '#16a34a';

      } else {

        variedadInput.value = 'Código no encontrado';
        variedadInput.style.color = '#dc2626';

      }

    })
    .withFailureHandler(function(error) {

      variedadInput.value = 'Error de búsqueda';
      variedadInput.style.color = '#dc2626';

      console.error(error);

    })
    .buscarProductoPorCodigo(codigo);
}


// ============================================================
// CALCULAR TOTAL KG
// ============================================================

function calcularTotalVenta() {

  var tbody = document.getElementById('tbody-ventas-detalle');

  var totalElemento = document.getElementById('venta-total-kilos');

  if (!tbody || !totalElemento) return;

  var total = 0;

  var filas = tbody.querySelectorAll('tr');

  filas.forEach(function(fila) {

    var inputs = fila.querySelectorAll('input');

    if (inputs.length >= 3) {

      var kg = parseFloat(inputs[2].value) || 0;

      total += kg;

    }

  });

  totalElemento.innerText = total.toLocaleString('en-US', {
    minimumFractionDigits: 3,
    maximumFractionDigits: 3
  });
}


// ============================================================
// GUARDAR VENTA
// ============================================================

function guardarVenta() {

  var correlativo = document.getElementById('venta-correlativo').value.trim();
  var fecha = document.getElementById('venta-fecha').value;
  var ruc = document.getElementById('venta-ruc').value.trim();
  var cliente = document.getElementById('venta-cliente').value.trim();

  if (!correlativo) {
    alert('Por favor, ingrese el correlativo.');
    return;
  }

  if (!fecha) {
    alert('Por favor, seleccione la fecha de despacho.');
    return;
  }

  if (!ruc) {
    alert('Por favor, ingrese el RUC.');
    return;
  }

  if (!cliente) {
    alert('Por favor, ingrese el cliente.');
    return;
  }

  var tbody = document.getElementById('tbody-ventas-detalle');

  var filas = tbody.querySelectorAll('tr');

  var detalle = [];

  for (var i = 0; i < filas.length; i++) {

    var inputs = filas[i].querySelectorAll('input');

    var codigo = inputs[0].value.trim();
    var variedad = inputs[1].value.trim();
    var kg = parseFloat(inputs[2].value) || 0;

    if (!codigo && kg === 0) {
      continue;
    }

    if (!codigo) {
      alert('Hay una línea sin código de producto.');
      return;
    }

    if (!variedad || variedad === 'Código no encontrado') {
      alert('Verifique que todos los códigos sean válidos.');
      return;
    }

    if (kg <= 0) {
      alert('Todos los productos deben tener KG mayor a cero.');
      return;
    }

    detalle.push({
      codigo: codigo,
      variedad: variedad,
      kgTotal: kg
    });
  }

  if (detalle.length === 0) {
    alert('Debe agregar al menos un producto a la venta.');
    return;
  }

  var payload = {
    correlativo: correlativo,
    fechaDespacho: fecha,
    ruc: ruc,
    cliente: cliente,
    detalle: detalle
  };

  var boton = document.querySelector('#tab-ventas .ventas-btn-guardar');

  if (boton) {
    boton.disabled = true;
    boton.innerText = 'GUARDANDO...';
  }

  google.script.run
    .withSuccessHandler(function(respuesta) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '💾 GUARDAR VENTA';
      }

      if (respuesta && respuesta.exito) {

        alert(
          '¡Venta guardada correctamente!\n\n' +
          'Correlativo: ' + correlativo
        );

        limpiarFormularioVenta();

      } else {

        alert(
          '❌ ' +
          (respuesta && respuesta.mensaje
            ? respuesta.mensaje
            : 'No se pudo guardar la venta.')
        );

      }

    })
    .withFailureHandler(function(error) {

      if (boton) {
        boton.disabled = false;
        boton.innerText = '💾 GUARDAR VENTA';
      }

      alert('Error en el servidor: ' + error.message);

    })
    .guardarVenta(payload);
}


// ============================================================
// BUSCAR VENTA POR CORRELATIVO
// ============================================================

function buscarVentaPorCorrelativo() {

  var input = document.getElementById('buscar-venta-correlativo');

  var correlativo = input.value.trim();

  if (!correlativo) {
    alert('Ingrese un correlativo para realizar la búsqueda.');
    return;
  }

  ocultarMensajeVenta();

  var resultado = document.getElementById('ventas-resultado');

  if (resultado) {
    resultado.classList.remove('visible');
  }

  google.script.run
    .withSuccessHandler(function(respuesta) {

      if (!respuesta || !respuesta.exito) {

        mostrarMensajeVenta(
          respuesta && respuesta.mensaje
            ? respuesta.mensaje
            : 'No se encontró la venta.',
          'error'
        );

        return;
      }

      mostrarResultadoVenta(respuesta);

    })
    .withFailureHandler(function(error) {

      mostrarMensajeVenta(
        'Error en el servidor: ' + error.message,
        'error'
      );

    })
    .buscarVentaPorCorrelativo(correlativo);
}


// ============================================================
// MOSTRAR VENTA ENCONTRADA
// ============================================================

function mostrarResultadoVenta(respuesta) {

  var datos = respuesta.datos;

  if (!datos || datos.length === 0) {
    mostrarMensajeVenta('No se encontraron registros.', 'error');
    return;
  }

  var primero = datos[0];

  document.getElementById('resultado-correlativo').innerText =
    primero.correlativo || '';

  document.getElementById('resultado-fecha').innerText =
    primero.fechaDespacho || '';

  document.getElementById('resultado-ruc').innerText =
    primero.ruc || '';

  document.getElementById('resultado-cliente').innerText =
    primero.cliente || '';

  var tbody = document.getElementById('tbody-ventas-resultado');

  tbody.innerHTML = '';

  var total = 0;

  datos.forEach(function(item) {

    var kg = parseFloat(item.kgTotal) || 0;

    total += kg;

    var tr = document.createElement('tr');

    tr.innerHTML = `
      <td>
        ${item.codigo || ''}
      </td>

      <td>
        ${item.variedad || ''}
      </td>

      <td style="text-align:right; font-weight:bold;">
        ${kg.toLocaleString('en-US', {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3
        })}
      </td>

      <td></td>
    `;

    tbody.appendChild(tr);

  });

  document.getElementById('resultado-total-kilos').innerText =
    total.toLocaleString('en-US', {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    });

  var resultado = document.getElementById('ventas-resultado');

  if (resultado) {
    resultado.classList.add('visible');
  }
}


// ============================================================
// MENSAJES
// ============================================================

function mostrarMensajeVenta(texto, tipo) {

  var mensaje = document.getElementById('ventas-mensaje');

  if (!mensaje) return;

  mensaje.className = 'ventas-mensaje ' + tipo;
  mensaje.innerText = texto;
}


function ocultarMensajeVenta() {

  var mensaje = document.getElementById('ventas-mensaje');

  if (!mensaje) return;

  mensaje.className = 'ventas-mensaje';
  mensaje.innerText = '';
}


// ============================================================
// LIMPIAR FORMULARIO
// ============================================================

function limpiarFormularioVenta() {

  var correlativo = document.getElementById('venta-correlativo');
  var fecha = document.getElementById('venta-fecha');
  var ruc = document.getElementById('venta-ruc');
  var cliente = document.getElementById('venta-cliente');

  if (correlativo) correlativo.value = '';
  if (ruc) ruc.value = '';
  if (cliente) cliente.value = '';

  if (fecha) {

    var hoy = new Date();

    var anio = hoy.getFullYear();
    var mes = String(hoy.getMonth() + 1).padStart(2, '0');
    var dia = String(hoy.getDate()).padStart(2, '0');

    fecha.value = anio + '-' + mes + '-' + dia;
  }

  var tbody = document.getElementById('tbody-ventas-detalle');

  if (tbody) {
    tbody.innerHTML = '';
    agregarFilaVenta();
  }

  var total = document.getElementById('venta-total-kilos');

  if (total) {
    total.innerText = '0.000';
  }
}
</script>
