    <div class="login-card">
      <div class="login-logo">
        <h2>SISTEMA DESCARTE</h2>
        <p>Inicie sesión para continuar</p>
      </div>
      
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="txt-usuario" placeholder="ejemplo.user">
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="txt-pass" placeholder="••••••••">
      </div>
      
      <div class="form-group">
        <label>Empresa / Rol</label>
        <select id="select-empresa">
          <option value="AGA">AGA</option>
          <option value="LARAMA">LARAMA</option>
          <option value="ARENUVA">ARENUVA</option>
          <option value="ADMIN">ADMINISTRADOR</option>
        </select>
      </div>
  <div style="text-align: center;">
      <button class="btn-login" onclick="ejecutarLogin()">Ingresar al Sistema</button>
      <div id="login-mensaje" class="login-error"></div>
    </div>
