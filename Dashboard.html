<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #C2D7D6;
      margin: 0;
      padding: 20px;
      color: #333333;
    }
    
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .dashboard-title {
      font-size: 24px;
      font-weight: bold;
      color: #486365;
    }
    
    /* Filtros Controls */
    .filter-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .filter-group label {
      font-size: 12px;
      font-weight: bold;
      color: #486365;
      text-transform: uppercase;
    }
    
    .filter-group select, .filter-group input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #B0C4C3;
      outline: none;
      font-size: 14px;
      background-color: #F8FAF9;
    }
    
    .btn-filter {
      background-color: #486365;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 18px;
      transition: background-color 0.2s;
    }
    
    .btn-filter:hover {
      background-color: #384c4d;
    }
    
    /* KPIs Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .kpi-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .kpi-title {
      font-size: 12px;
      font-weight: bold;
      color: #5E8A8F;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    
    .kpi-value {
      font-size: 28px;
      font-weight: bold;
      color: #333333;
    }
    
    /* Charts Layout */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 992px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .chart-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .chart-title {
      font-size: 16px;
      font-weight: bold;
      color: #486365;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="dashboard-title">Dashboard General</div>
  </div>

  <!-- Panel de Filtros -->
  <div class="filter-card">
    <div class="filter-group">
      <label for="empresaSelect">Empresa</label>
      <select id="empresaSelect">
        <option value="TODAS">TODAS LAS EMPRESAS</option>
        <option value="AGA">AGA</option>
        <option value="LARAMA">LARAMA</option>
        <option value="ARENUVA">ARENUVA</option>
      </select>
    </div>
    
    <div class="filter-group">
      <label for="fechaInicio">Fecha Inicio</label>
      <input type="date" id="fechaInicio">
    </div>
    
    <div class="filter-group">
      <label for="fechaFin">Fecha Fin</label>
      <input type="date" id="fechaFin">
    </div>
    
    <button class="btn-filter" onclick="cargarDashboard()">Filtrar Datos</button>
  </div>

  <!-- Tarjetas KPI -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-title">DESCARTE CAMPO (KG)</div>
      <div class="kpi-value" id="kpiCampo">0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">DESCARTE PACKING (KG)</div>
      <div class="kpi-value" id="kpiPacking">0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">TOTAL CONSOLIDADO (KG)</div>
      <div class="kpi-value" id="kpiTotal">0.00</div>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Descarte por Fechas y Tipo (Kg)</div>
      <canvas id="chartFechas" height="120"></canvas>
    </div>
    
    <div class="chart-card">
      <div class="chart-title">Descarte por Variedades (Kg)</div>
      <canvas id="chartVariedades" height="240"></canvas>
    </div>
  </div>

  <script>
    var chartFechasInstance = null;
    var chartVariedadesInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
      cargarDashboard();
    });

}

<div class="dashboard-grid">
  <div class="kpi-card">
    <span class="kpi-title">Kilos Totales</span>
    <span class="kpi-value" id="lblKilosTotales">0.00</span>
  </div>
  <div class="kpi-card">
    <span class="kpi-title">Total Guías</span>
    <span class="kpi-value" id="lblTotalGuias">0</span>
  </div>
  <div class="kpi-card">
    <span class="kpi-title">Guías Pendientes</span>
    <span class="kpi-value" id="lblGuiasPendientes">0</span>
  </div>
  <div class="kpi-card">
    <span class="kpi-title">Guías Aprobadas</span>
    <span class="kpi-value" id="lblGuiasAprobadas">0</span>
  </div>
</div>
}
